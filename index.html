<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIT Al Falah · Info Walimurid</title>
<meta property="og:title" content="MIT Al Falah · Info Walimurid">
<meta property="og:description" content="Pantau perkembangan belajar dan nilai siswa secara langsung.">
<meta property="og:type" content="website">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="MIT Al Falah — Pantau perkembangan belajar anak Anda">
<meta name="theme-color" content="#059669">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23059669'/%3E%3Ctext x='16' y='24' font-size='20' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EM%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>:root{
  --bg:#fafafa;--sf:#ffffff;--sf2:#f4f4f5;--tx:#18181b;--tx2:#52525b;--mt:#71717a;
  --bd:#e4e4e7;--bd2:#d4d4d8;--pr:#059669;--pr6:#047857;--p50:#ecfdf5;
  --ok:#059669;--okb:#ecfdf5;--wn:#d97706;--wnb:#fffbeb;
  --er:#dc2626;--erb:#fef2f2;--inf:#2563eb;--infb:#eff6ff;
  --sh:0 4px 20px -2px rgba(24,24,27,.05);
  --shl:0 12px 32px -4px rgba(5,150,105,.15);
  --r:18px;--rsm:12px;--rxs:8px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);
color:var(--tx);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
min-height:100vh;letter-spacing:-.011em;overflow-x:hidden}
.header{background:rgba(255,255,255,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:50;transition:all .3s}

.hinner{max-width:1120px;margin:0 auto;padding:.85rem 1.5rem;display:flex;
justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:inherit;cursor:pointer;transition:transform .2s}
.brand:hover{transform:scale(1.02)}
.blogo{width:42px;height:42px;background:linear-gradient(135deg,var(--pr),#10b981);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;color:#fff;flex-shrink:0;font-weight:800;letter-spacing:-.03em;overflow:hidden;box-shadow:0 4px 12px rgba(5,150,105,.3)}
.brand h1{font-size:1rem;font-weight:800;line-height:1.2;letter-spacing:-.02em}
.brand p{font-size:.75rem;color:var(--mt);font-weight:500}
.nav{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.nav a{color:var(--tx2);text-decoration:none;padding:.5rem .95rem;border-radius:99px;
font-size:.875rem;font-weight:600;cursor:pointer;transition:all .2s ease}
.nav a:hover{background:var(--sf2);color:var(--tx);transform:translateY(-1px)}
.nav a.act{background:var(--p50);color:var(--pr);font-weight:700;box-shadow:0 2px 8px rgba(5,150,105,.15)}
.tbtn{width:40px;height:40px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);
border-radius:50%;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;
justify-content:center;transition:all .25s ease;box-shadow:var(--sh)}
.tbtn:hover{background:var(--sf2);border-color:var(--bd2);transform:rotate(15deg) scale(1.05)}
.container{max-width:1120px;margin:0 auto;padding:2rem 1.5rem 5rem}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);
padding:1.75rem;margin-bottom:1.25rem;box-shadow:var(--sh);transition:all .3s ease;animation:fadeInUp .4s ease both}
.card:hover{box-shadow:var(--shl)}
h2{font-size:1.75rem;font-weight:800;letter-spacing:-.03em;margin-bottom:.35rem;line-height:1.2}
h3{font-size:1.05rem;font-weight:700;letter-spacing:-.02em;margin-bottom:1rem;
display:flex;align-items:center;gap:.5rem}
.sub{color:var(--mt);font-size:.9rem;margin-bottom:1.5rem}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;
flex-wrap:wrap;margin-bottom:1.5rem}
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.7rem 1.25rem;
border-radius:99px;font-size:.875rem;font-weight:700;text-decoration:none;
border:1px solid transparent;cursor:pointer;font-family:inherit;transition:all .25s cubic-bezier(.4,0,.2,1);
white-space:nowrap;line-height:1;letter-spacing:-.01em}
.bp{background:linear-gradient(135deg,var(--pr),#10b981);color:#fff;box-shadow:0 4px 14px rgba(5,150,105,.3)}
.bp:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 6px 20px rgba(5,150,105,.4)}
.bo{background:var(--sf);color:var(--tx);border-color:var(--bd);box-shadow:var(--sh)}
.bo:hover{border-color:var(--bd2);background:var(--sf2);transform:translateY(-1px)}
.bs{background:#059669;color:#fff}
.bs:hover{background:#047857;transform:translateY(-2px)}
.bd{background:#dc2626;color:#fff}
.bd:hover{background:#b91c1c;transform:translateY(-2px)}
.b-sm{padding:.45rem .95rem;font-size:.8rem}
input,select,textarea{width:100%;padding:.75rem 1rem;border:1px solid var(--bd);
border-radius:var(--rsm);font-size:.9rem;font-family:inherit;background:var(--sf);
color:var(--tx);transition:all .2s;letter-spacing:-.01em}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pr);
box-shadow:0 0 0 4px rgba(5,150,105,.15)}
input.err,select.err,textarea.err{border-color:var(--er);box-shadow:0 0 0 4px rgba(220,38,38,.15)}
label{display:block;margin-bottom:.45rem;font-size:.8rem;font-weight:700;
color:var(--tx2);letter-spacing:-.005em}
.fg{margin-bottom:1.15rem}
.search{position:relative;margin-bottom:1.25rem}
.search input{padding-left:2.5rem}
.search::before{content:'🔍';position:absolute;left:.9rem;top:50%;transform:translateY(-50%);
font-size:.85rem;opacity:.5;pointer-events:none}
.alert{padding:.85rem 1.1rem;border-radius:var(--rsm);margin-bottom:1.15rem;
font-size:.875rem;font-weight:600;animation:fadeIn .3s ease}
.aok{background:var(--okb);color:var(--ok);border:1px solid rgba(5,150,105,.2)}
.aer{background:var(--erb);color:var(--er);border:1px solid rgba(220,38,38,.2)}
.ainf{background:var(--infb);color:var(--inf);border:1px solid rgba(37,99,235,.2)}
.badge{display:inline-flex;align-items:center;justify-content:center;
padding:.35rem .75rem;border-radius:99px;font-size:.75rem;font-weight:800;
min-width:40px;letter-spacing:.01em;transition:transform .2s}
.badge:hover{transform:scale(1.08)}
.bL{background:var(--okb);color:var(--ok)}
.bCL{background:var(--wnb);color:var(--wn)}
.bKL{background:var(--erb);color:var(--er)}
.bE{background:var(--sf2);color:var(--mt)}
.grid{display:grid;gap:1.25rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.listrow{display:flex;align-items:center;gap:1rem;padding:1.1rem 1.25rem;
border-radius:var(--rsm);color:var(--tx);cursor:pointer;transition:all .25s ease;
border:1px solid transparent}
.listrow:hover{background:var(--sf2);border-color:var(--bd);transform:translateX(4px)}
.lbadge{width:52px;height:52px;background:var(--p50);color:var(--pr);border-radius:var(--rsm);
display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800;
flex-shrink:0;letter-spacing:-.02em}
.li{flex:1;min-width:0}
.lt{font-size:1rem;font-weight:700;letter-spacing:-.02em}
.lm{font-size:.82rem;color:var(--mt);margin-top:.2rem}
.la{color:var(--pr);font-size:1.2rem;font-weight:800;transition:transform .2s}
.listrow:hover .la{transform:translateX(6px)}
.srow{display:flex;align-items:center;gap:.9rem;padding:1rem 1.2rem;background:var(--sf);
border:1px solid var(--bd);border-radius:var(--rsm);cursor:pointer;margin-bottom:.65rem;
transition:all .25s ease;box-shadow:var(--sh)}
.srow:hover{border-color:var(--pr);background:var(--p50);transform:translateY(-2px) scale(1.01);box-shadow:var(--shl)}

.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
justify-content:center;font-weight:800;color:#fff;font-size:.9rem;flex-shrink:0;
letter-spacing:-.02em;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.av0{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.av1{background:linear-gradient(135deg,#10b981,#059669)}
.av2{background:linear-gradient(135deg,#f59e0b,#d97706)}
.av3{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.av4{background:linear-gradient(135deg,#ec4899,#db2777)}
.av5{background:linear-gradient(135deg,#06b6d4,#0891b2)}
.sinfo{flex:1;min-width:0}
.sn{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;
text-overflow:ellipsis;letter-spacing:-.015em}
.sm{font-size:.8rem;color:var(--mt);margin-top:.15rem}
.ssc{font-size:1.6rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.tw{overflow-x:auto;border-radius:var(--rsm);border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th,td{padding:.9rem 1.1rem;text-align:left;border-bottom:1px solid var(--bd)}
th{background:var(--sf2);font-weight:700;font-size:.75rem;text-transform:uppercase;
letter-spacing:.05em;color:var(--tx2);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .2s}
tbody tr:hover{background:var(--sf2)}
.tc{text-align:center}
.asp{padding:1.35rem 1rem;border:1px solid var(--bd);border-radius:var(--rsm);
background:var(--sf);text-align:center;position:relative;transition:all .25s ease;box-shadow:var(--sh)}
.asp:hover{border-color:var(--pr);transform:translateY(-4px);box-shadow:var(--shl)}
.asp[data-v="L"]{border-color:rgba(5,150,105,.4);background:linear-gradient(180deg,var(--sf),var(--okb))}
.asp[data-v="CL"]{border-color:rgba(217,119,6,.4);background:linear-gradient(180deg,var(--sf),var(--wnb))}
.asp[data-v="KL"]{border-color:rgba(220,38,38,.4);background:linear-gradient(180deg,var(--sf),var(--erb))}
.asp .al{font-size:.75rem;color:var(--mt);text-transform:uppercase;
letter-spacing:.06em;font-weight:800;margin-bottom:.75rem}
.asp .ad{font-size:.8rem;color:var(--tx2);margin-top:.5rem;font-weight:600}
.sbig{font-size:3.5rem;font-weight:800;line-height:1;letter-spacing:-.05em;animation:pop .4s cubic-bezier(.175,.885,.32,1.275)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.sOk{color:var(--ok)}.sCu{color:var(--wn)}.sPe{color:var(--er)}.sEm{color:var(--mt)}
.prog{height:8px;background:var(--sf2);border-radius:99px;overflow:hidden;margin-top:1rem}
.pbar{height:100%;background:linear-gradient(90deg,var(--pr),#34d399);
border-radius:99px;width:0;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.tabs{display:flex;gap:.35rem;border-bottom:1px solid var(--bd);margin-bottom:1.5rem;
overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.75rem 1.2rem;border:none;background:none;cursor:pointer;font-size:.875rem;
font-weight:600;color:var(--mt);border-bottom:3px solid transparent;margin-bottom:-1px;
font-family:inherit;white-space:nowrap;transition:all .2s;letter-spacing:-.01em}
.tab.act{color:var(--pr);border-bottom-color:var(--pr);font-weight:700}
.tab:hover:not(.act){color:var(--tx)}
.tc-c{display:none}
.tc-c.act{display:block;animation:fadeInUp .35s ease}
.tl{position:relative;padding-left:1.75rem}
.tl::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--bd)}
.tli{position:relative;padding-bottom:1.25rem}
.tli::before{content:'';position:absolute;left:-1.75rem;top:4px;width:14px;height:14px;
border-radius:50%;background:var(--sf);border:3px solid var(--pr);box-shadow:0 0 0 3px var(--p50)}
.tli .dt{font-size:.72rem;color:var(--mt);font-weight:700;margin-bottom:.3rem;
text-transform:uppercase;letter-spacing:.04em}
.tli .tx{font-size:.9rem;color:var(--tx)}
.stat{display:flex;align-items:center;gap:1rem;padding:1.25rem;background:var(--sf);
border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.si{width:52px;height:52px;border-radius:var(--rsm);display:flex;align-items:center;
justify-content:center;font-size:1.4rem;flex-shrink:0}
.siB{background:var(--p50);color:var(--pr)}.siG{background:var(--okb);color:var(--ok)}
.siA{background:var(--wnb);color:var(--wn)}
.sv{font-size:1.85rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.sl{font-size:.72rem;color:var(--mt);font-weight:700;text-transform:uppercase;
margin-top:.3rem;letter-spacing:.05em}
.cs{position:relative;height:220px;max-width:220px;margin:0 auto}
.cw{position:relative;height:260px}
.periods{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.5rem;padding:.4rem;
background:var(--sf2);border-radius:99px;width:fit-content}
.per{padding:.5rem 1.25rem;border-radius:99px;font-size:.82rem;font-weight:700;
color:var(--tx2);cursor:pointer;transition:all .25s ease}
.per:hover{color:var(--pr)}
.per.act{background:var(--sf);color:var(--pr);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.rec{padding:1.25rem 1.5rem;border-radius:var(--rsm);background:var(--p50);
border-left:4px solid var(--pr);font-size:.9rem;line-height:1.7;color:var(--tx)}

.rec ul{margin:.7rem 0 0 1.2rem}
.rec li{margin-bottom:.35rem}
.crumb{font-size:.82rem;color:var(--mt);margin-bottom:1.25rem;font-weight:600}
.crumb a{color:var(--pr);cursor:pointer;text-decoration:none;transition:color .2s}
.crumb a:hover{text-decoration:underline;color:var(--pr6)}
.crumb span{margin:0 .4rem;opacity:.4}
.attgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;margin-bottom:1rem}
.atti{padding:1.25rem .75rem;border-radius:var(--rsm);text-align:center;transition:transform .2s;box-shadow:var(--sh)}
.atti:hover{transform:translateY(-2px)}
.atti.h{background:var(--okb);color:var(--ok);border:1px solid rgba(5,150,105,.2)}
.atti.s{background:var(--wnb);color:var(--wn);border:1px solid rgba(217,119,6,.2)}
.atti.i{background:var(--infb);color:var(--inf);border:1px solid rgba(37,99,235,.2)}
.atti.a{background:var(--erb);color:var(--er);border:1px solid rgba(220,38,38,.2)}
.atti .n{font-size:1.85rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.atti .l{font-size:.72rem;font-weight:800;margin-top:.35rem;text-transform:uppercase;
letter-spacing:.05em;opacity:.9}
.footer{text-align:center;padding:2.5rem 1.5rem;color:var(--mt);font-size:.85rem;
border-top:1px solid var(--bd);background:var(--sf)}
.empty{padding:3rem 1.5rem;text-align:center;color:var(--mt);font-size:.9rem}
.empty .ico{font-size:2.5rem;margin-bottom:.75rem;opacity:.5;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
justify-content:center;gap:1rem;font-size:1rem;font-weight:600;color:var(--mt);z-index:9999}
#loading.hide{display:none}
.spinner{width:32px;height:32px;border:3px solid var(--bd);border-top-color:var(--pr);
border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.favCard{position:relative;display:block;padding:1.35rem;background:var(--sf);
border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;transition:all .25s ease;box-shadow:var(--sh)}
.favCard:hover{transform:translateY(-4px);border-color:var(--pr);box-shadow:var(--shl)}
.favCard .fb{width:48px;height:48px;background:linear-gradient(135deg,var(--pr),#10b981);color:#fff;border-radius:var(--rsm);
display:inline-flex;align-items:center;justify-content:center;font-weight:800;
font-size:1rem;margin-bottom:.85rem;letter-spacing:-.02em;box-shadow:0 4px 12px rgba(5,150,105,.25)}
.favCard .fn{font-weight:800;font-size:1rem;margin-bottom:.25rem;line-height:1.3;
letter-spacing:-.02em}
.favCard .fm{font-size:.8rem;color:var(--mt)}
.favCard .fdel{position:absolute;top:.75rem;right:.75rem;background:transparent;border:none;
width:30px;height:30px;border-radius:50%;cursor:pointer;color:var(--mt);font-size:1.1rem;
display:flex;align-items:center;justify-content:center;transition:all .2s;line-height:1}
.favCard .fdel:hover{background:var(--erb);color:var(--er);transform:scale(1.1)}
.qrCard{display:flex;gap:1.75rem;align-items:center;flex-wrap:wrap;background:var(--sf);
border:1px solid var(--bd);border-radius:var(--r);padding:1.75rem;margin-bottom:1.5rem;box-shadow:var(--sh)}
.qrCard img{border-radius:var(--rxs);border:1px solid var(--bd);padding:8px;background:#fff;display:block;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.qrCard p{font-size:.85rem;color:var(--mt);margin-bottom:.85rem;line-height:1.55}
.qrCopy{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.qrCopy input{flex:1;min-width:180px;font-size:.8rem;
font-family:'SF Mono',Menlo,monospace;background:var(--sf2);border-radius:var(--rxs)}
.pinBox{max-width:400px;margin:4rem auto;text-align:center;animation:fadeInUp .4s ease}
.pinBox .pic{font-size:3.5rem;margin-bottom:1rem;animation:float 3s ease-in-out infinite}
.pinBox input{text-align:center;font-size:1.85rem;letter-spacing:.6rem;padding:1.1rem;
font-weight:800;margin-bottom:1rem;font-family:'SF Mono',Menlo,monospace;border-radius:var(--rsm)}
.pinBox button{width:100%;justify-content:center;padding:1rem;font-size:1rem}
.hero{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);
padding:2.5rem 1.75rem;margin-bottom:1.75rem;text-align:center;box-shadow:var(--sh)}
.hero h2{font-size:2rem;font-weight:800;letter-spacing:-.035em;margin-bottom:.5rem;line-height:1.15}
.hero p{color:var(--mt);font-size:.95rem;margin-bottom:1.75rem;max-width:480px;
margin-left:auto;margin-right:auto}
.yearBar{display:flex;gap:.65rem;align-items:center;padding:.85rem 1.15rem;
background:var(--sf2);border-radius:var(--rsm);margin-bottom:1.5rem;flex-wrap:wrap}
.yearBar label{font-size:.72rem;font-weight:800;text-transform:uppercase;
letter-spacing:.05em;color:var(--mt);margin:0}
.yearBar select{padding:.45rem .75rem;font-size:.85rem;width:auto;min-width:130px;font-weight:700}
.yearBar .badgeArch{background:var(--wnb);color:var(--wn);padding:.4rem .8rem;
border-radius:var(--rxs);font-size:.78rem;font-weight:800}
.errMsg{color:var(--er);font-size:.8rem;margin-top:.4rem;display:none;font-weight:600}
.errMsg.show{display:block}
.auditItem{padding:.85rem 1.1rem;background:var(--sf2);border-radius:var(--rxs);
font-size:.82rem;margin-bottom:.5rem;border-left:4px solid var(--pr);transition:transform .2s}
.auditItem:hover{transform:translateX(4px)}
.auditItem .who{font-weight:800;color:var(--pr)}
.auditItem .when{color:var(--mt);font-size:.72rem;margin-top:.2rem}

/* ===== GOOGLE-LIKE HOME MODERN ===== */
.gHome{max-width:720px;margin:1rem auto 0;padding:2rem 1rem;animation:fadeInUp .5s cubic-bezier(.16,1,.3,1)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.gLogo{text-align:center;margin-bottom:2.5rem}
.gLogo .mark{font-size:3.75rem;line-height:1;margin-bottom:.75rem;
background:linear-gradient(135deg,#059669,#10b981,#34d399);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
font-weight:900;letter-spacing:-.06em;font-family:'Plus Jakarta Sans','Inter',sans-serif;
filter:drop-shadow(0 4px 12px rgba(5,150,105,.2))}
.gLogo .tag{font-size:1.15rem;color:var(--mt);font-weight:600;letter-spacing:-.02em}
.gLogo .school{font-size:.9rem;color:var(--tx2);font-weight:700;margin-top:.35rem;letter-spacing:.02em;text-transform:uppercase}
.gSearch{position:relative;margin-bottom:1.75rem}
.gSearch input{width:100%;font-size:1.05rem;padding:1.25rem 4rem 1.25rem 3.5rem;

/* ===== EFEK RIPPLE KLIK ===== */
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(5, 150, 105, 0.35);
  transform: scale(0);
  animation: rippleFx .5s linear;
  pointer-events: none;
}

@keyframes rippleFx {
  to { transform: scale(4); opacity: 0; }
}

/* ===== ANIMASI KARTU & INTERAKSI ===== */
.card, .gShort, .gRow, .srow, .asp, .favCard, .btn, .gChip, .tab {
  position: relative;
  overflow: hidden;
  will-change: transform;
}

/* Glow Shimmer Effect saat Hover */
.card::after, .gRow::after, .srow::after {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: linear-gradient(45deg, transparent, rgba(255,255,255,0.13), transparent);
  transform: rotate(30deg) translateY(-100%);
  transition: transform .6s ease;
  pointer-events: none;
}
.card:hover::after, .gRow:hover::after, .srow:hover::after {
  transform: rotate(30deg) translateY(100%);
}

/* Active Press Scaling Effect */
.btn:active, .gChip:active, .tab:active, .gShort:active, .srow:active, .gRow:active {
  transform: scale(0.95) !important;
  transition: transform 0.1s ease !important;
}

/* Pulse Glow Badge */
.badge {
  animation: pulseBadge 2.5s infinite;
}
@keyframes pulseBadge {
  0%, 100% { box-shadow: 0 0 0 0 rgba(5, 150, 105, 0.2); }
  50% { box-shadow: 0 0 0 6px rgba(5, 150, 105, 0); }
}

/* Page Transition Smooth Fade & Slide */
#app {
  animation: pageSlide .4s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes pageSlide {
  from { opacity: 0; transform: translateY(16px) scale(0.99); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

  });

async function getAbsen(sid, period, ta) {
  const t = ta || getTA();
  try {
    const s = await getDoc(doc(db, 'absensi', absenDocId(sid, period, t)));
    if (!s.exists()) return { hadir: 0, sakit: 0, izin: 0, alfa: 0 };
    return s.data();
  } catch (e) { return { hadir: 0, sakit: 0, izin: 0, alfa: 0 }; }
}
async function saveAbsen(sid, period, data, ta) {
  const t = ta || getTA();
  await setDoc(doc(db, 'absensi', absenDocId(sid, period, t)), {
    siswaId: sid, period, tahun_ajaran: t, semester: getSem(), ...data
  });
}
async function getCatatan(sid, period, ta) {
  const t = ta || getTA();
  try {
    const s = await getDocs(collection(db, 'catatan'));
    const o = [];
    s.forEach(d => {
      const v = d.data();
      if (v.siswaId !== sid) return;
      if (period && v.period !== period) return;
      if (v.tahun_ajaran !== t) return;
      o.push({ id: d.id, ...v });
    });
    o.sort((a, b) => (b.ts?.seconds || 0) - (a.ts?.seconds || 0));
    return o;
  } catch (e) { return []; }
}
async function addCatatan(sid, period, text, ta) {

  await addDoc(collection(db, 'catatan'), {

    tahun_ajaran: t, semester: getSem(), ts: serverTimestamp()
  });

async function seedIfEmpty() {
  const stu = await getStudents();
  if (stu.length > 0) return false;
  const b = writeBatch(db);
  for (const [k, w] of Object.entries(DEFAULT_CLASSES)) b.set(doc(db, 'kelas', k), { wali: w });
  b.set(doc(db, 'settings', 'main'), DEFAULT_SCHOOL);
  await b.commit();
  for (const [kelas, arr] of Object.entries(SEED)) {
    for (let i = 0; i < arr.length; i++) {
      const s = arr[i];
      const sid = kelas + '-' + String(i + 1).padStart(3, '0');
      await setDoc(doc(db, 'siswa', sid), { nama: s[0], kelas, access_code: sid, tahun_ajaran: getTA() });
      await saveNilai(sid, PERIODS[0], [s[1], s[2], s[3], s[4]]);
      await saveAbsen(sid, PERIODS[0], { hadir: 20, sakit: 0, izin: 0, alfa: 0 });

}

// ---------- Utilities ----------
function hitungNilai(a) { const v = a.filter(x => x); if (!v.length) return null; return Math.round(v.reduce((s, x) => s + (ASPECT_SCORES[x] || 0), 0) / v.length); }
function kategori(n) { if (n === null) return ['Belum Dinilai', 'Em']; if (n >= 85) return ['Baik', 'Ok']; if (n >= 75) return ['Cukup', 'Cu']; return ['Perlu Pendampingan', 'Pe']; }
function badge(v) { const c = v === 'L' ? 'bL' : v === 'CL' ? 'bCL' : v === 'KL' ? 'bKL' : 'bE'; return '<span class="badge ' + c + '">' + (v || '—') + '</span>'; }
function rekomendasi(a) {
  if (!a.some(x => x)) return ['Guru belum menginput nilai. Silakan hubungi wali kelas.', []];
  const items = [];
  a.forEach((v, i) => { if (v === 'KL') items.push('Perlu pendampingan intensif pada <b>' + ASPECTS[i] + '</b>.'); else if (v === 'CL') items.push('Perlu penguatan rutin pada <b>' + ASPECTS[i] + '</b>.'); });
  if (!items.length) return ['Ananda menunjukkan penguasaan baik di semua aspek. Berikan pengayaan dan apresiasi.', []];
  return ['Beberapa aspek masih perlu perhatian khusus:', items];
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(msg, type = 'ok') {
  const d = document.createElement('div');
  d.className = 'alert a' + (type === 'ok' ? 'ok' : type === 'err' ? 'er' : 'inf');
  d.textContent = msg;
  d.style.cssText = 'position:fixed;top:1rem;right:1rem;z-index:99999;max-width:320px;box-shadow:0 12px 30px rgba(0,0,0,.15);animation:fadeInUp .3s ease';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3000);
}

// Google-style search
let gTimer = null;
let gHL = -1;
let gSugList = [];

window.gInput = function (q) {
  clearTimeout(gTimer);
  _activeQuery = q.toLowerCase().trim();
  const box = document.getElementById('gSuggest');
  if (!_activeQuery) {
    box.classList.remove('show');
    box.innerHTML = '';
    gSugList = [];
    renderClassList();
    return;
  }
  gTimer = setTimeout(() => {
    let list = _allStudents.slice();
    if (_activeKelas !== 'all') list = list.filter(s => s.kelas === _activeKelas);
    list = list.filter(s =>
      s.nama.toLowerCase().includes(_activeQuery) ||
      (s.access_code || '').toLowerCase().includes(_activeQuery)
    );
    list.sort((a, b) => {
      const sa = a.nama.toLowerCase().startsWith(_activeQuery) ? 0 : 1;
      const sb = b.nama.toLowerCase().startsWith(_activeQuery) ? 0 : 1;
      if (sa !== sb) return sa - sb;
      return a.nama.localeCompare(b.nama);
    });
    list = list.slice(0, 8);
    gSugList = list;
    gHL = -1;

    if (!list.length) {
      box.innerHTML = `<div style="padding:1rem;text-align:center;color:var(--mt);font-size:.85rem">
        Tidak ada nama yang cocok dengan "<b>${esc(q)}</b>"
      </div>`;
      box.classList.add('show');
      return;
    }

    box.innerHTML = list.map((s, i) => {
      const hi = highlight(s.nama, _activeQuery);
      const ini = s.nama.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
      return `<div class="gSugItem" data-i="${i}" onclick="gPick(${i})" onmouseenter="gHover(${i})">
        <div class="sIco av${i % 6}">${ini}</div>
        <div class="sTxt">
          <div class="sN">${hi}</div>
          <div class="sM">Kelas ${s.kelas} · ${s.access_code}</div>
        </div>
        <div class="sSc s${kategoriSilent(s)}" id="gSc${i}"></div>
      </div>`;
    }).join('');
    box.classList.add('show');

    list.forEach(async (s, i) => {
      const n = hitungNilai(await getNilai(s.id, PERIODS[0]));
      const el = document.getElementById('gSc' + i);
      if (el) {
        const [, kc] = kategori(n);
        el.textContent = n !== null ? n : '—';
        el.className = 'sSc s' + kc;
      }
    });
  }, 80);
};

function kategoriSilent() { return 'Em'; }

function highlight(text, q) {
  const idx = text.toLowerCase().indexOf(q);
  if (idx < 0) return esc(text);
  const before = text.slice(0, idx);
  const match = text.slice(idx, idx + q.length);
  const after = text.slice(idx + q.length);
  return esc(before) + '<b>' + esc(match) + '</b>' + esc(after);
}

window.gPick = function (i) {
  const s = gSugList[i];
  if (s) go('/siswa/' + s.id);
};

window.gHover = function (i) {
  gHL = i;
  document.querySelectorAll('.gSugItem').forEach((el, idx) => {
    el.classList.toggle('hl', idx === i);
  });
};

window.gFocus = function () {
  const box = document.getElementById('gSuggest');
  if (box.innerHTML.trim() && _activeQuery) box.classList.add('show');
};

window.gBlur = function () {
  setTimeout(() => {
    const box = document.getElementById('gSuggest');
    if (box) box.classList.remove('show');
  }, 200);
};

window.gGo = function () {
  if (gSugList.length) go('/siswa/' + gSugList[0].id);
};

window.gChip = function (k) {
  _activeKelas = k;
  document.querySelectorAll('.gChip').forEach(c => {
    c.classList.toggle('act', c.dataset.kelas === k);
  });
  const inp = document.getElementById('gIn');
  if (inp) inp.placeholder = k === 'all' ? 'Cari nama anak...' : 'Cari di Kelas ' + k + '...';
  if (inp && inp.value.trim()) gInput(inp.value);
  else renderClassList();
};

document.addEventListener('keydown', e => {
  const box = document.getElementById('gSuggest');
  if (!box || !box.classList.contains('show')) return;
  const items = document.querySelectorAll('.gSugItem');
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    gHL = Math.min(gHL + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('hl', i === gHL));
    items[gHL].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    gHL = Math.max(gHL - 1, 0);
    items.forEach((el, i) => el.classList.toggle('hl', i === gHL));
    items[gHL].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter' && gHL >= 0) {
    e.preventDefault();
    gPick(gHL);
  } else if (e.key === 'Escape') {
    box.classList.remove('show');
  }
});

  const rekHtml = '<div class="rec">' + rekText + (rekItems.length ? '<ul>' + rekItems.map(x => '<li>' + x + '</li>').join('') + '</ul>' : '') + '</div>';
  let prevN = null;

window.go = go;

window.showTab = function (id, btn) {
  document.querySelectorAll('.tc-c').forEach(x => x.classList.remove('act'));
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('act'));
  document.getElementById(id).classList.add('act');
  btn.classList.add('act');
};
window.filterRows = function (q, sel) {
  const s = q.toLowerCase();
  document.querySelectorAll(sel).forEach(r => { r.style.display = r.textContent.toLowerCase().includes(s) ? '' : 'none'; });
};
window.copyText = function (inpId, btnId) {
  const inp = document.getElementById(inpId);
  if (!inp) return;
  inp.select();
  const done = () => { const b = document.getElementById(btnId); if (!b) return; const o = b.innerHTML; b.innerHTML = '&#10003; Tersalin'; setTimeout(() => b.innerHTML = o, 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(inp.value).then(done).catch(() => { document.execCommand('copy'); done(); });
  else { document.execCommand('copy'); done(); }
};

window.backupData = async function () {
  toast('Menyiapkan...', 'inf');
  try {
    const data = { version: 1, ts: new Date().toISOString(), collections: {} };
    for (const c of ['settings', 'kelas', 'siswa', 'nilai', 'absensi', 'catatan', 'audit']) {
      const snap = await getDocs(collection(db, c));
      data.collections[c] = {};
      snap.forEach(d => data.collections[c][d.id] = d.data());
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'walimurid-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    localStorage.setItem('walimurid_last_backup', Date.now());
    toast('✅ Backup ter-download', 'ok');
  } catch (e) { toast('Gagal: ' + e.message, 'err'); }
};
window.restoreData = function () {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = async ev => {
    const f = ev.target.files[0];
    if (!f) return;
    if (!confirm('Restore akan MENIMPA data. Lanjut?')) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data.collections) throw new Error('Format tidak valid');
      for (const [colN, docs] of Object.entries(data.collections)) {
        for (const [id, d] of Object.entries(docs)) await setDoc(doc(db, colN, id), d);
      }
      toast('✅ Restore selesai', 'ok');
      setTimeout(render, 800);
    } catch (e) { toast('Gagal: ' + e.message, 'err'); }
  };
  inp.click();
};
window.importCSVSiswa = function () {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.csv,.txt';
  inp.onchange = async ev => {
    const f = ev.target.files[0];
    if (!f) return;
    try {
      const txt = await f.text();
      const lines = txt.split(/\r?\n/).filter(l => l.trim());
      if (lines.length < 1) throw new Error('CSV kosong');
      let start = 0;
      if (/nama/i.test(lines[0])) start = 1;
      let ok = 0, skip = 0;
      for (let i = start; i < lines.length; i++) {
        const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
        if (cols.length < 3) { skip++; continue; }
        const [kode, nama, kelas] = cols;
        if (!kode || !nama || !kelas) { skip++; continue; }
        const ref = doc(db, 'siswa', kode.toUpperCase());
        const ex = await getDoc(ref);
        if (ex.exists()) { skip++; continue; }
        await setDoc(ref, { access_code: kode.toUpperCase(), nama, kelas: kelas.toUpperCase(), tahun_ajaran: getTA() });
        ok++;
      }
      toast('✅ ' + ok + ' ditambah, ' + skip + ' dilewati', 'ok');
      setTimeout(render, 800);
    } catch (e) { toast('Gagal: ' + e.message, 'err'); }
  };
  inp.click();
};
window.exportCSV = async function (kelas, period) {
  const all = await getStudents();
  const list = all.filter(s => s.kelas === kelas).sort((a, b) => a.nama.localeCompare(b.nama));
  const rows = [['Kode', 'Nama', 'Kelas', ...ASPECTS, 'Nilai', 'Kategori', 'Hadir', 'Sakit', 'Izin', 'Alfa']];
  for (const s of list) {
    const a = await getNilai(s.id, period);
    const n = hitungNilai(a);
    const [kt] = kategori(n);
    const att = await getAbsen(s.id, period);
    rows.push([s.access_code, s.nama, s.kelas, ...a, n ?? '', kt, att.hadir || 0, att.sakit || 0, att.izin || 0, att.alfa || 0]);
  }
  const csv = '\ufeff' + rows.map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'rekap_' + kelas + '_' + period.replace(/\s/g, '_') + '.csv';
  a.click();
  URL.revokeObjectURL(url);
};

// Global Ripple Effect pada Klik
document.addEventListener('click', function (e) {
  const target = e.target.closest('.btn, .gChip, .tab, .gShort, .srow, .gRow, .card, .asp, .gSugItem');
  if (!target) return;
  
  const rect = target.getBoundingClientRect();
  const circle = document.createElement('span');
  const diameter = Math.max(rect.width, rect.height);
  const radius = diameter / 2;

  circle.style.width = circle.style.height = `${diameter}px`;
  circle.style.left = `${e.clientX - rect.left - radius}px`;
  circle.style.top = `${e.clientY - rect.top - radius}px`;
  circle.classList.add('ripple');

  const existingRipple = target.querySelector('.ripple');
  if (existingRipple) existingRipple.remove();

  target.appendChild(circle);
});

// 3D Tilt Effect saat Mouse Move
document.addEventListener('mousemove', function (e) {
  const card = e.target.closest('.favCard, .asp, .gShort');
  if (!card) return;
  const rect = card.getBoundingClientRect();
  const x = e.clientX - rect.left - rect.width / 2;
  const y = e.clientY - rect.top - rect.height / 2;
  card.style.transform = `perspective(600px) rotateX(${-y / 12}deg) rotateY(${x / 12}deg) translateY(-4px)`;
});

document.addEventListener('mouseout', function (e) {
  const card = e.target.closest('.favCard, .asp, .gShort');
  if (card) card.style.transform = '';
});

boot();
