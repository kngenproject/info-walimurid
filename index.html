<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0078D4">
<link rel="manifest" href="manifest.json">
<title>Info Walimurid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="config.js"></script>
<style>
/* ============================================================
   FLUENT DESIGN — Info Walimurid
   Based on design.md (Estilo Fluent AI)
   ============================================================ */

:root{
  /* Colors — Light */
  --primary:#0078D4;
  --primary-dark:#005A9E;
  --primary-light:#DEECF9;
  --secondary:#FFFFFF;
  --tertiary:#2F2F2F;
  --neutral:#F2F2F2;
  --neutral-2:#E1E1E1;
  --neutral-3:#C8C8C8;
  --surface:#FFFFFF;
  --surface-2:#FAFAFA;
  --surface-3:#F5F5F5;
  --text:#1F1F1F;
  --text-2:#4A4A4A;
  --text-3:#767676;
  --border:#E1E1E1;
  --border-2:#C8C8C8;

  /* Semantic */
  --success:#107C10;
  --success-bg:#DFF6DD;
  --warn:#FF8C00;
  --warn-bg:#FFF4CE;
  --error:#C42B1C;
  --error-bg:#FDE7E9;
  --info:#0078D4;
  --info-bg:#DEECF9;
  --accent:#5C2D91;
  --accent-bg:#EFE7F7;

  /* Radius */
  --r-sm:4px;
  --r-md:8px;
  --r-lg:12px;

  /* Shadow */
  --sh-sm:0 1px 2px rgba(0,0,0,0.04);
  --sh-md:0 2px 12px rgba(0,0,0,0.06);
  --sh-lg:0 8px 24px rgba(0,0,0,0.08);

  /* Motion */
  --ease:cubic-bezier(0.16,1,0.3,1);
  --dur-fast:150ms;
  --dur:200ms;
  --dur-slow:420ms;

  /* Spacing */
  --sp-1:0.25rem;--sp-2:0.5rem;--sp-3:0.75rem;--sp-4:1rem;
  --sp-5:1.25rem;--sp-6:1.5rem;--sp-8:2rem;--sp-12:3rem;--sp-16:4rem;

  /* Layout */
  --maxw:1280px;
  --pad:1.5rem;

  /* z-index */
  --z-base:0;--z-sticky:100;--z-overlay:200;--z-modal:300;--z-toast:500;
}

[data-theme="dark"]{
  --primary:#4CA0E0;
  --primary-dark:#3A87C7;
  --primary-light:#1A3A5C;
  --secondary:#1F1F1F;
  --tertiary:#F2F2F2;
  --neutral:#2B2B2B;
  --neutral-2:#3A3A3A;
  --neutral-3:#4A4A4A;
  --surface:#1A1A1A;
  --surface-2:#232323;
  --surface-3:#2B2B2B;
  --text:#F2F2F2;
  --text-2:#C8C8C8;
  --text-3:#8C8C8C;
  --border:#3A3A3A;
  --border-2:#4A4A4A;

  --success:#4CC24C;
  --success-bg:#0E3A0E;
  --warn:#FFA940;
  --warn-bg:#3D2900;
  --error:#F1707B;
  --error-bg:#3D1418;
  --info:#4CA0E0;
  --info-bg:#0A2844;
  --accent:#B794D9;
  --accent-bg:#2A1A3D;

  --sh-sm:0 1px 2px rgba(0,0,0,0.3);
  --sh-md:0 2px 12px rgba(0,0,0,0.4);
  --sh-lg:0 8px 24px rgba(0,0,0,0.5);
}

/* Reset */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--surface-2);
  color:var(--text);
  font-size:1rem;
  line-height:1.6;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
img,svg{max-width:100%;display:block}

:focus-visible{
  outline:2px solid var(--primary);
  outline-offset:2px;
  border-radius:var(--r-sm);
}

/* Typography */
h1,h2,h3,h4{font-weight:600;line-height:1.25;letter-spacing:-0.01em;color:var(--text)}
h1{font-size:2.5rem;font-weight:700;letter-spacing:-0.02em}
h2{font-size:1.5rem;font-weight:600;letter-spacing:-0.01em}
h3{font-size:1.125rem;font-weight:600}
h4{font-size:0.95rem;font-weight:600;color:var(--text-2)}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:0.875rem}

/* Layout primitives */
.container{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.stack>*+*{margin-top:var(--sp-4)}
.row{display:flex;align-items:center;gap:var(--sp-3)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap}
.grid{display:grid;gap:var(--sp-4)}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}

/* ============ HEADER ============ */
.header{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;
  z-index:var(--z-sticky);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
[data-theme="light"] .header{background:rgba(255,255,255,0.85)}
[data-theme="dark"] .header{background:rgba(26,26,26,0.85)}

.header-inner{
  max-width:var(--maxw);
  margin:0 auto;
  padding:0.75rem var(--pad);
  display:flex;align-items:center;justify-content:space-between;
  gap:var(--sp-4);
}

.brand{display:flex;align-items:center;gap:0.75rem;text-decoration:none;color:inherit;cursor:pointer;min-width:0}
.brand:hover{text-decoration:none}
.brand-logo{
  width:36px;height:36px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center;
  color:#fff;flex-shrink:0;
  box-shadow:var(--sh-sm);
}
.brand-logo svg{width:20px;height:20px;stroke:#fff}
.brand-text{min-width:0}
.brand-text h1{font-size:0.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.brand-text p{font-size:0.75rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nav{display:flex;gap:0.25rem;align-items:center}
.nav a,.nav button{
  color:var(--text-2);
  text-decoration:none;
  padding:0.5rem 0.875rem;
  border-radius:var(--r-sm);
  font-size:0.875rem;
  font-weight:500;
  cursor:pointer;
  border:none;
  background:transparent;
  min-height:36px;
  display:inline-flex;align-items:center;gap:0.4rem;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}
.nav a:hover,.nav button:hover{background:var(--neutral);color:var(--text);text-decoration:none}
.nav a.active{background:var(--primary-light);color:var(--primary);font-weight:600}

.icon-btn{
  width:36px;height:36px;
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:var(--r-sm);
  cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--text-2);
  transition:all var(--dur) var(--ease);
}
.icon-btn:hover{background:var(--neutral);color:var(--text);border-color:var(--border-2)}
.icon-btn svg{width:18px;height:18px}

/* ============ MAIN ============ */
.main{min-height:calc(100dvh - 200px);padding:var(--sp-6) 0 var(--sp-16)}

/* ============ CARDS ============ */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:var(--sp-5);
  box-shadow:var(--sh-sm);
  transition:box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease);
}
.card:hover{box-shadow:var(--sh-md)}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;
  min-height:36px;
  padding:0.5rem 1rem;
  border-radius:var(--r-sm);
  font-size:0.875rem;
  font-weight:500;
  text-decoration:none;
  border:1.5px solid transparent;
  cursor:pointer;
  transition:all var(--dur) var(--ease);
  white-space:nowrap;
  user-select:none;
}
.btn:hover{text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}

.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);box-shadow:var(--sh-md)}

.btn-secondary{background:transparent;color:var(--primary);border-color:var(--border-2)}
.btn-secondary:hover{background:var(--primary-light);border-color:var(--primary)}

.btn-ghost{background:transparent;color:var(--text-2);border-color:transparent}
.btn-ghost:hover{background:var(--neutral);color:var(--text)}

.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-success:hover{opacity:0.9}

.btn-danger{background:var(--error);color:#fff;border-color:var(--error)}
.btn-danger:hover{opacity:0.9}

.btn-sm{min-height:30px;padding:0.35rem 0.75rem;font-size:0.8125rem}
.btn-lg{min-height:44px;padding:0.65rem 1.25rem;font-size:0.9375rem}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============ INPUTS ============ */
.field{margin-bottom:var(--sp-4)}
.field label{
  display:block;margin-bottom:0.4rem;
  font-size:0.8125rem;font-weight:500;color:var(--text-2);
}
.input,.select,.textarea{
  width:100%;
  min-height:38px;
  padding:0.5rem 0.75rem;
  border:1px solid var(--border-2);
  border-radius:var(--r-sm);
  font-size:0.9375rem;
  background:var(--surface);
  color:var(--text);
  transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
}
.input:focus,.select:focus,.textarea:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-light);
}
.input::placeholder{color:var(--text-3)}
.textarea{min-height:80px;resize:vertical;font-family:inherit}

.input-search{position:relative}
.input-search input{padding-left:2.5rem}
.input-search svg{
  position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);
  width:18px;height:18px;stroke:var(--text-3);fill:none;stroke-width:2;pointer-events:none;
}

/* ============ ALERTS ============ */
.alert{
  padding:0.75rem 1rem;
  border-radius:var(--r-sm);
  font-size:0.875rem;
  border-left:3px solid;
  margin-bottom:var(--sp-4);
  display:flex;align-items:flex-start;gap:0.5rem;
}
.alert svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.alert-info{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.alert-success{background:var(--success-bg);color:var(--success);border-color:var(--success)}
.alert-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.alert-error{background:var(--error-bg);color:var(--error);border-color:var(--error)}

/* ============ BADGE ============ */
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:32px;
  padding:0.2rem 0.5rem;
  border-radius:var(--r-sm);
  font-size:0.75rem;font-weight:600;
  letter-spacing:0.02em;
}
.badge-l{background:var(--success-bg);color:var(--success)}
.badge-cl{background:var(--warn-bg);color:var(--warn)}
.badge-kl{background:var(--error-bg);color:var(--error)}
.badge-empty{background:var(--neutral);color:var(--text-3)}

/* ============ HERO ============ */
.hero{
  background:linear-gradient(135deg,var(--primary) 0%,var(--accent) 100%);
  color:#fff;
  border-radius:var(--r-lg);
  padding:clamp(1.5rem,4vw,2.5rem);
  margin-bottom:var(--sp-6);
  position:relative;
  overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:-50%;right:-20%;
  width:400px;height:400px;
  background:radial-gradient(circle,rgba(255,255,255,0.15),transparent 70%);
  pointer-events:none;
}
.hero-inner{
  display:grid;grid-template-columns:1fr;gap:var(--sp-6);
  position:relative;z-index:1;
}
@media(min-width:768px){.hero-inner{grid-template-columns:1.5fr 1fr}}
.hero h1{color:#fff;font-size:clamp(1.5rem,4vw,2.25rem);margin-bottom:0.5rem}
.hero p{opacity:0.92;font-size:1rem;line-height:1.5}
.hero-actions{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:var(--sp-5)}
.hero-actions .btn{background:rgba(255,255,255,0.15);color:#fff;border-color:rgba(255,255,255,0.3);backdrop-filter:blur(8px)}
.hero-actions .btn:hover{background:rgba(255,255,255,0.25)}
.hero-actions .btn-primary{background:#fff;color:var(--primary);border-color:#fff}
.hero-actions .btn-primary:hover{background:var(--neutral)}

.hero-stats{
  display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-3);
  align-self:center;
}
.hero-stat{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:var(--r-md);
  padding:0.875rem 1rem;
}
.hero-stat .v{font-size:1.5rem;font-weight:700;line-height:1;color:#fff}
.hero-stat .l{font-size:0.75rem;opacity:0.85;margin-top:0.25rem;text-transform:uppercase;letter-spacing:0.05em;font-weight:500}

/* ============ LIST KELAS ============ */
.list-row{
  display:flex;align-items:center;gap:var(--sp-4);
  padding:var(--sp-4);
  border-radius:var(--r-md);
  text-decoration:none;color:var(--text);
  border:1px solid transparent;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease);
  cursor:pointer;
}
.list-row:hover{
  background:var(--surface-2);
  border-color:var(--border);
  text-decoration:none;
  transform:translateX(2px);
}
.list-badge{
  width:44px;height:44px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;
  border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center;
  font-size:0.9rem;font-weight:700;
  flex-shrink:0;
  box-shadow:var(--sh-sm);
}
.list-body{flex:1;min-width:0}
.list-title{font-size:0.9375rem;font-weight:600;line-height:1.3}
.list-meta{font-size:0.8125rem;color:var(--text-3);margin-top:0.15rem;line-height:1.4}
.list-meta b{color:var(--error);font-weight:600}
.list-score{
  min-width:48px;padding:0.35rem 0.5rem;
  border-radius:var(--r-sm);
  text-align:center;
  font-weight:700;font-size:1.125rem;
  background:var(--neutral);
  color:var(--text-2);
}
.list-score.s-ok{background:var(--success-bg);color:var(--success)}
.list-score.s-cu{background:var(--warn-bg);color:var(--warn)}
.list-score.s-pe{background:var(--error-bg);color:var(--error)}

/* ============ STUDENT ROW ============ */
.student-row{
  display:flex;align-items:center;gap:var(--sp-3);
  padding:0.75rem 1rem;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  text-decoration:none;color:var(--text);
  margin-bottom:0.5rem;
  transition:all var(--dur) var(--ease);
}
.student-row:hover{
  border-color:var(--primary);
  background:var(--primary-light);
  text-decoration:none;
  transform:translateX(2px);
}
.avatar{
  width:36px;height:36px;
  border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center;
  font-weight:600;color:#fff;font-size:0.75rem;
  flex-shrink:0;
  letter-spacing:0.02em;
}
.avatar-0{background:linear-gradient(135deg,#0078D4,#005A9E)}
.avatar-1{background:linear-gradient(135deg,#107C10,#0A5A0A)}
.avatar-2{background:linear-gradient(135deg,#FF8C00,#C56A00)}
.avatar-3{background:linear-gradient(135deg,#5C2D91,#42206A)}
.avatar-4{background:linear-gradient(135deg,#C42B1C,#8E1E13)}
.avatar-5{background:linear-gradient(135deg,#008080,#005A5A)}
.student-info{flex:1;min-width:0}
.student-name{font-weight:500;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.student-meta{font-size:0.75rem;color:var(--text-3);margin-top:0.1rem}
.student-score{font-size:1.125rem;font-weight:700;min-width:40px;text-align:right}
.student-score.s-ok{color:var(--success)}
.student-score.s-cu{color:var(--warn)}
.student-score.s-pe{color:var(--error)}
.student-score.s-em{color:var(--text-3)}

/* ============ CHIPS ============ */
.chips{display:flex;gap:0.375rem;flex-wrap:wrap;margin-bottom:var(--sp-4)}
.chip{
  min-height:30px;padding:0.3rem 0.75rem;
  border-radius:99px;
  border:1px solid var(--border-2);
  background:var(--surface);
  color:var(--text-2);
  font-size:0.8125rem;font-weight:500;
  cursor:pointer;
  transition:all var(--dur) var(--ease);
}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* ============ TABS ============ */
.tabs{
  display:flex;gap:0.125rem;
  border-bottom:1px solid var(--border);
  margin-bottom:var(--sp-4);
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:0.65rem 0.875rem;
  border:none;background:none;cursor:pointer;
  font-size:0.875rem;font-weight:500;
  color:var(--text-3);
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  white-space:nowrap;
  min-height:42px;
  transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease);
  display:inline-flex;align-items:center;gap:0.4rem;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn var(--dur-slow) var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ============ PERIODS ============ */
.periods{
  display:inline-flex;gap:0.25rem;
  padding:0.25rem;
  background:var(--neutral);
  border-radius:var(--r-md);
  margin-bottom:var(--sp-4);
  max-width:100%;
  overflow-x:auto;
}
.period{
  padding:0.4rem 0.875rem;
  border-radius:var(--r-sm);
  font-size:0.8125rem;font-weight:500;
  color:var(--text-2);
  cursor:pointer;
  min-height:32px;
  display:inline-flex;align-items:center;
  text-decoration:none;
  transition:all var(--dur) var(--ease);
  white-space:nowrap;
}
.period:hover{color:var(--text);text-decoration:none}
.period.active{background:var(--surface);color:var(--primary);font-weight:600;box-shadow:var(--sh-sm)}

/* ============ TABLE ============ */
.table-wrap{
  overflow-x:auto;
  border-radius:var(--r-md);
  border:1px solid var(--border);
  background:var(--surface);
}
table{width:100%;border-collapse:collapse;font-size:0.875rem}
th,td{padding:0.65rem 0.875rem;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{
  background:var(--surface-3);
  font-weight:600;
  font-size:0.75rem;
  text-transform:uppercase;
  letter-spacing:0.05em;
  color:var(--text-2);
}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background var(--dur) var(--ease)}
tbody tr:hover{background:var(--surface-2)}
.tc{text-align:center}

/* ============ ASPECT CARD ============ */
.aspect{
  padding:1rem 0.875rem;
  border:1px solid var(--border);
  border-radius:var(--r-md);
  background:var(--surface);
  text-align:center;
  position:relative;
  overflow:hidden;
  transition:all var(--dur) var(--ease);
}
.aspect:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
.aspect::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--border)}
.aspect[data-v="L"]::before{background:var(--success)}
.aspect[data-v="CL"]::before{background:var(--warn)}
.aspect[data-v="KL"]::before{background:var(--error)}
.aspect-label{
  font-size:0.6875rem;color:var(--text-3);
  text-transform:uppercase;letter-spacing:0.06em;font-weight:600;
  margin-bottom:0.5rem;
}
.aspect-desc{font-size:0.75rem;color:var(--text-2);margin-top:0.4rem}
.aspect-score{font-size:0.6875rem;color:var(--text-3);margin-top:0.25rem}

/* ============ BIG SCORE ============ */
.big-score{font-size:3rem;font-weight:700;line-height:1;letter-spacing:-0.03em}
.s-ok{color:var(--success)}
.s-cu{color:var(--warn)}
.s-pe{color:var(--error)}
.s-em{color:var(--text-3)}

/* ============ PROGRESS ============ */
.progress{
  height:6px;
  background:var(--neutral);
  border-radius:99px;
  overflow:hidden;
  margin-top:var(--sp-4);
}
.progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  border-radius:99px;
  width:0;
  transition:width 900ms var(--ease);
}

/* ============ ATTENDANCE GRID ============ */
.att-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.5rem;margin-bottom:var(--sp-4)}
.att-item{padding:0.875rem 0.5rem;border-radius:var(--r-md);text-align:center;transition:transform var(--dur) var(--ease)}
.att-item:hover{transform:translateY(-2px)}
.att-item.h{background:var(--success-bg);color:var(--success)}
.att-item.s{background:var(--warn-bg);color:var(--warn)}
.att-item.i{background:var(--info-bg);color:var(--info)}
.att-item.a{background:var(--error-bg);color:var(--error)}
.att-item .n{font-size:1.375rem;font-weight:700;line-height:1}
.att-item .l{font-size:0.6875rem;font-weight:500;margin-top:0.3rem;text-transform:uppercase;letter-spacing:0.04em}

/* ============ TIMELINE ============ */
.timeline{position:relative;padding-left:1.5rem}
.timeline::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--border)}
.tl-item{position:relative;padding-bottom:var(--sp-4)}
.tl-item::before{
  content:'';position:absolute;left:-1.5rem;top:6px;
  width:10px;height:10px;border-radius:50%;
  background:var(--primary);
  border:2px solid var(--surface);
  box-shadow:0 0 0 2px var(--border);
}
.tl-date{font-size:0.6875rem;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:0.04em}
.tl-text{margin-top:0.25rem;font-size:0.875rem;color:var(--text)}

/* ============ RECOMMENDATION ============ */
.recommendation{
  padding:1rem 1.125rem;
  border-radius:var(--r-md);
  background:var(--info-bg);
  border-left:3px solid var(--info);
  font-size:0.875rem;
  line-height:1.6;
  color:var(--text);
}
.recommendation ul{margin:0.5rem 0 0 1.25rem}
.recommendation li{margin-bottom:0.25rem}

/* ============ BREADCRUMB ============ */
.breadcrumb{
  display:flex;flex-wrap:wrap;gap:0.35rem;
  font-size:0.8125rem;
  color:var(--text-3);
  margin-bottom:var(--sp-4);
  align-items:center;
}
.breadcrumb a{color:var(--primary);text-decoration:none}
.breadcrumb a:hover{text-decoration:underline}
.breadcrumb span{color:var(--text-3)}

/* ============ EMPTY STATE ============ */
.empty{
  padding:3rem 1.5rem;
  text-align:center;
  color:var(--text-3);
}
.empty-icon{
  width:48px;height:48px;
  margin:0 auto var(--sp-4);
  stroke:var(--text-3);fill:none;stroke-width:1.5;
  opacity:0.5;
}
.empty-title{font-size:0.9375rem;font-weight:600;color:var(--text-2);margin-bottom:0.25rem}
.empty-text{font-size:0.875rem;margin-bottom:var(--sp-4)}

/* ============ SKELETON ============ */
.skeleton{
  background:linear-gradient(90deg,var(--surface-3),var(--neutral),var(--surface-3));
  background-size:200% 100%;
  border-radius:var(--r-md);
  animation:shimmer 1.5s infinite;
  height:64px;
  margin-bottom:0.75rem;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ============ TOAST ============ */
.toasts{
  position:fixed;top:1rem;right:1rem;left:1rem;
  z-index:var(--z-toast);
  display:flex;flex-direction:column;align-items:flex-end;
  gap:0.5rem;pointer-events:none;
}
.toasts .alert{
  pointer-events:auto;
  max-width:380px;
  margin:0;
  box-shadow:var(--sh-lg);
  animation:slideIn 300ms var(--ease);
}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* ============ FOOTER ============ */
.footer{
  text-align:center;
  padding:var(--sp-8) var(--pad);
  color:var(--text-3);
  font-size:0.8125rem;
  border-top:1px solid var(--border);
  background:var(--surface);
  margin-top:var(--sp-8);
}
.footer-sub{margin-top:0.35rem;font-size:0.75rem;opacity:0.8}

/* ============ LOADING OVERLAY ============ */
#loading-overlay{
  position:fixed;inset:0;
  background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  gap:0.75rem;
  font-size:0.9375rem;
  color:var(--text-3);
  z-index:9999;
  padding:1rem;text-align:center;
  transition:opacity 300ms var(--ease);
}
#loading-overlay.hidden{opacity:0;pointer-events:none}
.spinner{
  width:28px;height:28px;
  border:3px solid var(--border);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ CRUMB ============ */
.crumb{
  font-size:0.8125rem;
  color:var(--text-3);
  margin-bottom:var(--sp-4);
  display:flex;flex-wrap:wrap;gap:0.35rem;
  align-items:center;
}
.crumb a{color:var(--primary);text-decoration:none}
.crumb a:hover{text-decoration:underline}

/* ============ PAGE HEADER ============ */
.page-header{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:var(--sp-4);flex-wrap:wrap;
  margin-bottom:var(--sp-6);
}
.page-title{font-size:1.5rem;font-weight:600;letter-spacing:-0.01em}
.page-sub{font-size:0.875rem;color:var(--text-3);margin-top:0.25rem}

/* ============ SECTION ============ */
.section{margin-bottom:var(--sp-8)}
.section-title{
  font-size:0.9375rem;font-weight:600;
  margin-bottom:var(--sp-4);
  display:flex;align-items:center;gap:0.5rem;
  color:var(--text);
}
.section-title svg{width:18px;height:18px;stroke:var(--primary);fill:none;stroke-width:2}

/* ============ RESPONSIVE ============ */
@media(max-width:640px){
  :root{--pad:1rem}
  .main{padding:var(--sp-4) 0 var(--sp-12)}
  .big-score{font-size:2.5rem}
  .att-grid{grid-template-columns:repeat(2,1fr)}
  .brand-text p{display:none}
  .nav a,.nav button{padding:0.4rem 0.6rem;font-size:0.8125rem}
  .hero-stat .v{font-size:1.25rem}
  .hero h1{font-size:1.4rem}
  .page-title{font-size:1.25rem}
}

/* ============ PRINT ============ */
@media print{
  .header,.footer,.btn,.icon-btn,.tabs,.periods,.crumb,.no-print,.input-search,.chips{display:none!important}
  .card{box-shadow:none;border:1px solid #ddd}
  .tab-content{display:block!important}
  body{background:#fff;color:#000}
  .main{padding:0}
}

/* ============ UTILITY ============ */
.mb-0{margin-bottom:0}
.mb-2{margin-bottom:var(--sp-2)}
.mb-4{margin-bottom:var(--sp-4)}
.mb-6{margin-bottom:var(--sp-6)}
.mt-4{margin-top:var(--sp-4)}
.mt-6{margin-top:var(--sp-6)}
.text-muted{color:var(--text-3)}
.text-center{text-align:center}
.w-full{width:100%}
.flex-wrap{flex-wrap:wrap}
.hidden{display:none!important}
</style>

// ============ DATA LAYER ============
async function freshDocs(ref) {
  try { return await getDocsFromServer(ref); }
  catch (e) { return await getDocs(ref); }
}

async function getSchool() {
  try {
    const snap = await getDoc(doc(db, 'settings', 'main'));
    if (snap.exists()) return { ...DEFAULT_SCHOOL, ...snap.data() };
  } catch (e) { console.warn('getSchool', e); }
  return { ...DEFAULT_SCHOOL };
}

async function getClasses() {
  const snap = await freshDocs(collection(db, 'kelas'));
  const out = {};
  snap.forEach(d => { out[d.id] = d.data().wali || ''; });
  return out;
}

async function getStudents() {
  const snap = await freshDocs(collection(db, 'siswa'));
  const out = [];
  snap.forEach(d => out.push({ id: d.id, ...d.data() }));
  return out;
}

async function loadPeriod(period) {
  const [nSnap, aSnap] = await Promise.all([
    freshDocs(query(collection(db, 'nilai'), where('period', '==', period))),
    freshDocs(query(collection(db, 'absensi'), where('period', '==', period)))
  ]);
  const nilai = {}, absen = {};
  nSnap.forEach(d => {
    const v = d.data();
    nilai[v.siswaId] = [v.a0 || '', v.a1 || '', v.a2 || '', v.a3 || ''];
  });
  aSnap.forEach(d => { absen[d.data().siswaId] = d.data(); });
  return { nilai, absen };
}

async function getNilai(sid, period) {
  const snap = await getDoc(doc(db, 'nilai', `${sid}__${period}`));
  if (!snap.exists()) return [...EMPTY];
  const d = snap.data();
  return [d.a0 || '', d.a1 || '', d.a2 || '', d.a3 || ''];
}

async function saveNilai(sid, period, arr) {
  await setDoc(doc(db, 'nilai', `${sid}__${period}`), {
    siswaId: sid, period,
    a0: arr[0], a1: arr[1], a2: arr[2], a3: arr[3]
  });
}

async function getAbsen(sid, period) {
  const snap = await getDoc(doc(db, 'absensi', `${sid}__${period}`));
  return snap.exists() ? snap.data() : { hadir: 0, sakit: 0, izin: 0, alfa: 0 };
}

async function saveAbsen(sid, period, data) {
  await setDoc(doc(db, 'absensi', `${sid}__${period}`), { siswaId: sid, period, ...data });
}

async function getCatatan(sid, period) {
  const snap = await getDocs(query(collection(db, 'catatan'), where('siswaId', '==', sid)));
  const out = [];
  snap.forEach(d => {
    const v = d.data();
    if (!period || v.period === period) out.push({ id: d.id, ...v });
  });
  out.sort((a, b) => (b.ts?.seconds || 0) - (a.ts?.seconds || 0));
  return out;
}

async function addCatatan(sid, period, text) {
  await addDoc(collection(db, 'catatan'), {
    siswaId: sid, period, text, ts: serverTimestamp()
  });
}

async function seedIfEmpty() {
  const students = await getStudents();
  if (students.length > 0) return false;
  const b = writeBatch(db);
  for (const [kelas, wali] of Object.entries(DEFAULT_CLASSES)) {
    b.set(doc(db, 'kelas', kelas), { wali });
  }
  b.set(doc(db, 'settings', 'main'), DEFAULT_SCHOOL);
  await b.commit();
  for (const [kelas, arr] of Object.entries(SEED)) {
    for (let i = 0; i < arr.length; i++) {
      const s = arr[i];
      const sid = `${kelas}-${String(i + 1).padStart(3, '0')}`;
      await setDoc(doc(db, 'siswa', sid), { nama: s[0], kelas, access_code: sid });
      await saveNilai(sid, PERIODS[0], [s[1], s[2], s[3], s[4]]);
      await saveAbsen(sid, PERIODS[0], { hadir: 20, sakit: 0, izin: 0, alfa: 0 });
    }
  }
  return true;
}

async function ensureSeeded() {
  try {
    const students = await getStudents();
    if (students.length > 0) return true;
    if (!currentUser) return false;
    const done = await seedIfEmpty();
    if (done) toast('Data awal dimuat otomatis', 'success');
    return done;
  } catch (e) {
    console.warn('ensureSeeded', e);
    return false;
  }
}

// ============ UTILITY ============
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function hitungNilai(a) {
  const v = a.filter(x => x);
  if (!v.length) return null;
  return Math.round(v.reduce((s, x) => s + (ASPECT_SCORES[x] || 0), 0) / v.length);
}

function kategori(n) {
  if (n === null || n === undefined) return { label: 'Belum dinilai', k: 'em' };
  if (n >= 85) return { label: 'Baik', k: 'ok' };
  if (n >= 75) return { label: 'Cukup', k: 'cu' };
  return { label: 'Perlu pendampingan', k: 'pe' };
}

function classStat(list, nilai) {
  const vals = list.map(s => hitungNilai(nilai[s.id] || EMPTY)).filter(v => v !== null);
  const avg = vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
  return { n: list.length, filled: vals.length, avg, perlu: vals.filter(v => v < 75).length };
}

function badge(v) {
  const cls = v === 'L' ? 'badge-l' : v === 'CL' ? 'badge-cl' : v === 'KL' ? 'badge-kl' : 'badge-empty';
  return `<span class="badge ${cls}">${v || '—'}</span>`;
}

function initials(nama) {
  return nama.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function fmtDate(ts) {
  return ts?.seconds ? new Date(ts.seconds * 1000).toLocaleString('id-ID', {
    day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
  }) : '-';
}

function friendly(e) {
  if (e?.code === 'permission-denied') return 'Akses ditolak. Login ulang sebagai guru.';
  if (e?.code === 'unavailable' || !navigator.onLine) return 'Tidak ada koneksi. Data akan disimpan saat online.';
  if (e?.code === 'auth/invalid-credential') return 'Email atau password salah.';
  return e?.message || 'Terjadi kesalahan.';
}

function toast(msg, type = 'success') {
  const d = document.createElement('div');
  const ico = type === 'success' ? ICON.check : type === 'error' ? ICON.alert : type === 'warn' ? ICON.alert : ICON.info;
  d.className = `alert alert-${type}`;
  d.innerHTML = ico + '<span>' + esc(msg) + '</span>';
  const box = $('toasts');
  if (box) {
    box.appendChild(d);
    setTimeout(() => d.remove(), 3500);
  }
}

async function run(btn, busyHtml, fn) {
  const orig = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = busyHtml; }
  try { return await fn(); }
  catch (e) { console.error(e); toast('Gagal: ' + friendly(e), 'error'); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = orig; } }
}

function skeleton(n = 3) {
  let s = '';
  for (let i = 0; i < n; i++) s += '<div class="skeleton"></div>';
  return s;
}

function emptyState(iconName, title, text, actionHtml = '') {
  const ico = ICON[iconName] || ICON.info;
  return `<div class="empty">
    <div class="empty-icon" style="display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;width:56px;height:56px;background:var(--surface-3);border-radius:50%">${ico}</div>
    <div class="empty-title">${esc(title)}</div>
    <div class="empty-text">${esc(text)}</div>
    ${actionHtml}
  </div>`;
}

function rowSiswa(s, nilai, i = 0) {
  const n = hitungNilai(nilai?.[s.id] || EMPTY);
  const kt = kategori(n);
  return `<a class="student-row" href="#/siswa/${encodeURIComponent(s.id)}">
    <div class="avatar avatar-${i % 6}">${esc(initials(s.nama))}</div>
    <div class="student-info">
      <div class="student-name">${esc(s.nama)}</div>
      <div class="student-meta">Kelas ${esc(s.kelas)} · ${kt.label}</div>
    </div>
    <div class="student-score s-${kt.k}">${n ?? '—'}</div>
  </a>`;
}

// ============ FAVORIT ============
function getFavs() {
  try { return JSON.parse(localStorage.getItem('favSiswa') || '[]'); }
  catch (e) { return []; }
}
function isFav(id) { return getFavs().some(f => f.id === id); }

window.toggleFav = function (sid, el) {
  let favs = getFavs();
  if (isFav(sid)) favs = favs.filter(f => f.id !== sid);
  else favs.push({ id: sid, nama: el.dataset.nama, kelas: el.dataset.kelas });
  localStorage.setItem('favSiswa', JSON.stringify(favs));
  const fav = isFav(sid);
  el.innerHTML = (fav ? ICON.starFill : ICON.star) + '<span>' + (fav ? 'Favorit' : 'Favorit') + '</span>';
  el.setAttribute('aria-pressed', fav);
  toast(fav ? 'Ditambahkan ke favorit' : 'Dihapus dari favorit', 'success');
};

// ============ ROUTER ============
function go(path) { location.hash = '#' + path; }

function parseRoute() {
  const hash = (location.hash || '#/').slice(1);
  return hash.split('/').filter(Boolean).map(p => {
    try { return decodeURIComponent(p); } catch (e) { return p; }
  });
}

function destroyCharts() {
  charts.forEach(c => c.destroy());
  charts = [];
}

function updateNav() {
  const cur = parseRoute()[0] || 'home';
  const home = $('nav-home'), admin = $('nav-admin');
  if (home) home.classList.toggle('active', cur === 'home');
  if (admin) admin.classList.toggle('active', cur === 'admin');
}

async function render() {
  const my = ++renderSeq;
  destroyCharts();
  updateNav();
  const parts = parseRoute();
  const app = $('app');
  if (!app) return;
  app.innerHTML = skeleton(3);
  let view;
  try {
    if (parts.length === 0) view = await viewHome();
    else if (parts[0] === 'admin') view = await viewAdmin(parts.slice(1));
    else if (parts[0] === 'kelas' && parts[1]) view = await viewKelas(parts[1]);
    else if (parts[0] === 'siswa' && parts[1]) view = await viewSiswa(parts[1], parts[2] || PERIODS[0]);
    else view = await viewHome();
  } catch (e) {
    console.error(e);
    view = { html: `<div class="card">${emptyState('alert', 'Terjadi kesalahan', friendly(e), '<button class="btn btn-secondary" onclick="render()">Coba lagi</button>')}</div>` };
  }
  if (my !== renderSeq) return;
  app.innerHTML = view.html;
  if (view.after) view.after();
}
window.render = render;
window.go = go;

window.homeSearch = function (q) {
  q = (q || '').trim().toLowerCase();

    .filter(s => s.nama.toLowerCase().includes(q))
    .sort((a, b) => a.nama.localeCompare(b.nama))

  box.innerHTML = hits.length
    ? `<div class="card"><div class="section-title">${ICON.users} Hasil Pencarian (${hits.length})</div>${hits.map((s, i) => rowSiswa(s, homeCache.nilai, i)).join('')}</div>`

const FILTERS = ['Semua', 'Baik', 'Cukup', 'Perlu pendampingan', 'Belum dinilai'];

function paintKelas() {
  if (!kelasView || !$('kList')) return;
  const { list, nilai, filter, q } = kelasView;
  $('kChips').innerHTML = FILTERS.map(f => {
    const n = f === 'Semua'
      ? list.length
      : list.filter(s => kategori(hitungNilai(nilai[s.id] || EMPTY)).label === f).length;
    return `<button type="button" class="chip ${f === filter ? 'active' : ''}" data-filter="${esc(f)}">${f} (${n})</button>`;
  }).join('');
  $('kChips').querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => setKelasFilter(btn.dataset.filter));
  });
  const rows = list.filter(s => {
    const kt = kategori(hitungNilai(nilai[s.id] || EMPTY)).label;
    return (filter === 'Semua' || kt === filter) && s.nama.toLowerCase().includes(q);
  });
  $('kList').innerHTML = rows.length
    ? rows.map((s, i) => rowSiswa(s, nilai, i)).join('')
    : emptyState('search', 'Tidak ada siswa', 'Tidak ada siswa yang cocok dengan filter atau pencarian.');
}

window.setKelasFilter = f => { kelasView.filter = f; paintKelas(); };
window.kelasSearch = q => { kelasView.q = (q || '').trim().toLowerCase(); paintKelas(); };

async function viewSiswa(sid, period) {

  const s = { id: snap.id, ...snap.data() };
  const classes = await getClasses();
  const wali = classes[s.kelas] || '';

  const [a, att, notes] = await Promise.all([
    getNilai(sid, period),
    getAbsen(sid, period),
    getCatatan(sid, period)
  ]);
  const hist = await Promise.all(PERIODS.map(async p => {
    const aspects = await getNilai(sid, p);
    return { period: p, aspects, nilai: hitungNilai(aspects) };
  }));

  const nilai = hitungNilai(a);
  const kt = kategori(nilai);
  const cnt = {
    L: a.filter(x => x === 'L').length,
    CL: a.filter(x => x === 'CL').length,
    KL: a.filter(x => x === 'KL').length
  };

  const rekItems = a.map((v, i) =>
    v === 'KL' ? `Perlu pendampingan intensif pada <b>${ASPECTS[i]}</b>.`
    : v === 'CL' ? `Perlu penguatan rutin pada <b>${ASPECTS[i]}</b>.`
    : null
  ).filter(Boolean);
  const rekText = !a.some(x => x)
    ? 'Guru belum menginput nilai. Silakan hubungi wali kelas.'
    : !rekItems.length
      ? 'Ananda menunjukkan penguasaan baik di semua aspek. Berikan pengayaan dan apresiasi.'
      : 'Beberapa aspek masih perlu perhatian khusus:';

  const totalHari = (att.hadir || 0) + (att.sakit || 0) + (att.izin || 0) + (att.alfa || 0);
  const pct = totalHari ? Math.round((att.hadir || 0) / totalHari * 100) : 0;
  const fav = isFav(sid);
  const shareText = `Laporan ${s.nama} (${period}): nilai ${nilai ?? '-'} (${kt.label}). ${location.href}`;

  let prev = null;
  const histRows = hist.map(h => {
    let tr = '<span class="text-muted">—</span>';
    if (h.nilai !== null && prev !== null) {
      if (h.nilai > prev) tr = `<span style="color:var(--success);font-weight:600">+${h.nilai - prev}</span>`;
      else if (h.nilai < prev) tr = `<span style="color:var(--error);font-weight:600">${h.nilai - prev}</span>`;
      else tr = '<span class="text-muted">=</span>';
    }
    if (h.nilai !== null) prev = h.nilai;
    const hk = kategori(h.nilai);
    return `<tr>
      <td><b>${esc(h.period)}</b></td>
      <td>${h.aspects.map(badge).join(' ')}</td>
      <td class="tc"><span class="big-score s-${hk.k}" style="font-size:1.125rem">${h.nilai ?? '—'}</span></td>
      <td>${hk.label}</td>
      <td class="tc">${tr}</td>

  return {

        </button>

        <button type="button" class="btn btn-primary btn-sm" onclick="window.print()">${ICON.printer} Cetak</button>
      </div>
    </div>

    <div class="periods no-print">
      ${PERIODS.map(p => `<a class="period ${p === period ? 'active' : ''}" href="#/siswa/${encodeURIComponent(sid)}/${encodeURIComponent(p)}">${esc(p)}</a>`).join('')}
    </div>

    <div class="grid grid-2">
      <div class="card text-center" style="padding:1.75rem">
        <div style="font-size:0.6875rem;color:var(--text-3);text-transform:uppercase;letter-spacing:0.08em;font-weight:600">Nilai Akhir · ${esc(period)}</div>
        <div class="big-score s-${kt.k}" style="margin:0.75rem 0">${nilai ?? '—'}</div>
        <div style="font-size:1rem;font-weight:600">${kt.label}</div>
        <div class="progress"><div class="progress-bar" data-w="${nilai || 0}"></div></div>
        <div style="font-size:0.75rem;color:var(--text-3);margin-top:0.5rem">${a.filter(x => x).length}/${ASPECTS.length} aspek sudah dinilai</div>
      </div>
      <div class="card text-center">
        <div class="section-title" style="justify-content:center">${ICON.chart} Distribusi Penilaian</div>
        <div style="position:relative;height:180px;max-width:180px;margin:0 auto"><canvas id="dc" role="img" aria-label="Distribusi penilaian"></canvas></div>
        <div style="display:flex;justify-content:center;gap:1rem;margin-top:1rem;font-size:0.8125rem;font-weight:500;flex-wrap:wrap">
          <span><span class="badge badge-l">L</span> ${cnt.L}</span>
          <span><span class="badge badge-cl">CL</span> ${cnt.CL}</span>
          <span><span class="badge badge-kl">KL</span> ${cnt.KL}</span>

    </div>

    <div class="card">
      <div class="tabs no-print" role="tablist">
        <button type="button" class="tab active" data-tab="t1">${ICON.book} Aspek</button>
        <button type="button" class="tab" data-tab="t2">${ICON.chart} Riwayat & Tren</button>
        <button type="button" class="tab" data-tab="t3">${ICON.calendar} Absensi</button>
        <button type="button" class="tab" data-tab="t4">${ICON.info} Rekomendasi</button>
        <button type="button" class="tab" data-tab="t5">${ICON.note} Catatan Guru</button>
      </div>

      <div id="t1" class="tab-content active">
        <div class="grid grid-4">
          ${a.map((v, i) => {
            const cls = v === 'L' ? 'badge-l' : v === 'CL' ? 'badge-cl' : v === 'KL' ? 'badge-kl' : 'badge-empty';
            return `<div class="aspect" data-v="${v}">
              <div class="aspect-label">${ASPECTS[i]}</div>
              <span class="badge ${cls}" style="font-size:0.9375rem;padding:0.35rem 0.75rem">${v || '—'}</span>
              <div class="aspect-desc">${ASPECT_LABELS[v]}</div>
              <div class="aspect-score">Skor ${ASPECT_SCORES[v] || '—'}</div>
            </div>`;
          }).join('')}
        </div>
        <div style="margin-top:1rem;padding-top:0.875rem;border-top:1px solid var(--border);font-size:0.75rem;color:var(--text-3)">
          <b>Keterangan:</b>
          <span class="badge badge-l">L</span> Lancar (90) &nbsp;
          <span class="badge badge-cl">CL</span> Cukup Lancar (80) &nbsp;
          <span class="badge badge-kl">KL</span> Kurang Lancar (70)
        </div>
      </div>

      <div id="t2" class="tab-content">
        ${hasTrend ? `<div class="section-title">${ICON.chart} Perkembangan Nilai</div><div style="position:relative;height:220px"><canvas id="tc" role="img" aria-label="Grafik perkembangan nilai"></canvas></div>` : ''}
        <div class="section-title" style="margin-top:1.25rem">${ICON.fileText || ICON['file-text']} Riwayat per Periode</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Periode</th><th>Aspek</th><th class="tc">Nilai</th><th>Kategori</th><th class="tc">Tren</th></tr></thead>
            <tbody>${histRows}</tbody>
          </table>
        </div>
      </div>

      <div id="t3" class="tab-content">
        <div class="section-title">${ICON.calendar} Rekap Absensi ${esc(period)}</div>
        <div class="att-grid">
          <div class="att-item h"><div class="n">${att.hadir || 0}</div><div class="l">Hadir</div></div>
          <div class="att-item s"><div class="n">${att.sakit || 0}</div><div class="l">Sakit</div></div>
          <div class="att-item i"><div class="n">${att.izin || 0}</div><div class="l">Izin</div></div>
          <div class="att-item a"><div class="n">${att.alfa || 0}</div><div class="l">Alfa</div></div>
        </div>
        <div class="text-center text-muted" style="font-size:0.875rem">Total <b>${totalHari}</b> hari · Kehadiran <b>${pct}%</b></div>
      </div>

      <div id="t4" class="tab-content">
        <div class="recommendation">${rekText}${rekItems.length ? `<ul>${rekItems.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}</div>
      </div>

      <div id="t5" class="tab-content">
        <div class="timeline">
          ${notes.length
            ? notes.map(n => `<div class="tl-item"><div class="tl-date">${fmtDate(n.ts)} · ${esc(n.period || '')}</div><div class="tl-text">${esc(n.text)}</div></div>`).join('')
            : `<div class="empty">${emptyState('note', 'Belum ada catatan', 'Catatan dari guru akan muncul di sini.')}</div>`}
        </div>
      </div>
    </div>`,

    after: () => {
      // Tab switching
      document.querySelectorAll('.tab').forEach(t => {
        t.addEventListener('click', () => {
          document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
          document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
          const el = $(t.dataset.tab);
          if (el) el.classList.add('active');
          t.classList.add('active');
        });
      });

      // Favorit
      const favBtn = $('btnFav');
      if (favBtn) {
        favBtn.addEventListener('click', () => window.toggleFav(sid, favBtn));
      }

      // Progress bar
      setTimeout(() => {
        document.querySelectorAll('.progress-bar').forEach(b => {
          b.style.width = b.dataset.w + '%';
        });
      }, 80);

      // Charts
      const isD = document.documentElement.getAttribute('data-theme') === 'dark';
      const cc = isD ? ['#4CC24C', '#FFA940', '#F1707B'] : ['#107C10', '#FF8C00', '#C42B1C'];

      if ($('dc') && window.Chart) {
        charts.push(new Chart($('dc'), {
          type: 'doughnut',
          data: {
            labels: ['L', 'CL', 'KL'],
            datasets: [{
              data: [cnt.L, cnt.CL, cnt.KL],
              backgroundColor: cc,
              borderWidth: 0,
              hoverOffset: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '70%',
            plugins: { legend: { display: false } }
          }
        }));
      }

      const labels = hist.filter(h => h.nilai !== null).map(h => h.period);
      const data = hist.filter(h => h.nilai !== null).map(h => h.nilai);
      if (labels.length && $('tc') && window.Chart) {
        const lineColor = isD ? '#4CA0E0' : '#0078D4';
        charts.push(new Chart($('tc'), {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label: 'Nilai',
              data,
              borderColor: lineColor,
              backgroundColor: isD ? 'rgba(76,160,224,0.15)' : 'rgba(0,120,212,0.12)',
              fill: true,
              tension: 0.35,
              pointRadius: 5,
              pointBackgroundColor: lineColor,
              pointBorderColor: isD ? '#1A1A1A' : '#FFFFFF',
              pointBorderWidth: 2,
              borderWidth: 2.5
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: true, max: 100, grid: { color: isD ? '#3A3A3A' : '#E1E1E1' }, ticks: { color: isD ? '#8C8C8C' : '#767676' } },
              x: { grid: { display: false }, ticks: { color: isD ? '#8C8C8C' : '#767676' } }
            },
            plugins: { legend: { display: false } }
          }
        }));
      }
    }
  };
}

function renderLogin(err = '') {
  return {
    html: `
    <div class="page-header">
      <div>
        <div class="page-title">Panel Guru</div>
        <div class="page-sub">Masuk untuk mengelola data siswa & nilai</div>
      </div>
    </div>
    <div class="card" style="max-width:420px;margin:0 auto">
      ${err ? `<div class="alert alert-error">${ICON.alert}<span>${esc(err)}</span></div>` : ''}
      <form onsubmit="doLogin(event)">
        <div class="field">
          <label for="em">Email</label>
          <input id="em" name="email" class="input" type="email" required autocomplete="username" placeholder="guru@sekolah.id">
        </div>
        <div class="field">
          <label for="pw">Password</label>
          <input id="pw" name="pass" class="input" type="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button class="btn btn-primary w-full" type="submit">${ICON.logout} Masuk</button>
      </form>

window.doLogin = async function (ev) {
  ev.preventDefault();
  const f = ev.target;
  const btn = f.querySelector('button');
  await run(btn, 'Masuk…', async () => {
    try {
      await signInWithEmailAndPassword(auth, f.email.value.trim(), f.pass.value);
    } catch (e) {
      $('app').innerHTML = renderLogin('Email atau password salah.').html;
    }
  });
};

window.doLogout = async function () { await signOut(auth); go('/'); };

window.saveEdit = async function (ev, sid, period) {
  ev.preventDefault();
  const f = ev.target;
  const btn = ev.submitter;
  const goNext = !!btn && btn.name === 'next';
  const buttons = [...f.querySelectorAll('button')];
  const labels = buttons.map(b => b.innerHTML);
  buttons.forEach(b => { b.disabled = true; });
  if (btn) btn.innerHTML = 'Menyimpan…';
  try {
    await saveNilai(sid, period, [f.a0.value, f.a1.value, f.a2.value, f.a3.value]);
    await saveAbsen(sid, period, {
      hadir: +f.hadir.value || 0,
      sakit: +f.sakit.value || 0,
      izin: +f.izin.value || 0,
      alfa: +f.alfa.value || 0
    });
    if (f.note.value.trim()) await addCatatan(sid, period, f.note.value.trim());
    toast('Tersimpan', 'success');
    if (goNext) {
      const all = await getStudents();
      const cur = all.find(s => s.id === sid);
      const list = all.filter(s => cur && s.kelas === cur.kelas).sort((a, b) => a.nama.localeCompare(b.nama));
      const nx = list[list.findIndex(s => s.id === sid) + 1];
      if (nx) return go(`/admin/edit/${encodeURIComponent(nx.id)}/${encodeURIComponent(period)}`);
      toast('Ini siswa terakhir di kelas ini', 'info');
    }
    render();
  } catch (e) {
    toast('Gagal menyimpan: ' + friendly(e), 'error');
    buttons.forEach((b, i) => { b.disabled = false; b.innerHTML = labels[i]; });
  }
};

// ============ CSV UTIL ============
function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') q = false;
      else cell += ch;
    } else {
      if (ch === '"') q = true;
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (ch === '\r') { /* skip */ }
      else cell += ch;
    }
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()));
}

function csvDownload(filename, rows) {
  const csv = '\ufeff' + rows.map(r =>
    r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')
  ).join('\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

window.importSiswa = async function (input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const lbl = input.previousElementSibling;
  const orig = lbl ? lbl.innerHTML : '';
  try {
    const rows = parseCSV(await file.text());
    if (rows.length < 2) { toast('File kosong atau format salah', 'error'); return; }
    const h = rows[0].map(x => x.trim().toLowerCase());
    const iK = h.indexOf('kode'), iN = h.indexOf('nama'), iC = h.indexOf('kelas');
    if (iK < 0 || iN < 0 || iC < 0) { toast('Header harus: kode, nama, kelas', 'error'); return; }
    const items = [];
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      const kode = String(r[iK] || '').trim().toUpperCase();
      const nama = String(r[iN] || '').trim().replace(/\s+/g, ' ');
      const kelas = String(r[iC] || '').trim().toUpperCase();
      if (!kode || !nama || !kelas) continue;
      if (!/^[A-Z0-9-]+$/.test(kode)) {
        toast('Baris ' + (i + 1) + ': kode "' + kode + '" tidak valid', 'error');
        return;
      }
      items.push({ kode, nama, kelas });
    }
    if (!items.length) { toast('Tidak ada baris valid', 'error'); return; }
    if (!confirm('Import ' + items.length + ' siswa? Kode yang sama akan ditimpa.')) return;
    if (lbl) lbl.innerHTML = 'Mengimpor…';
    input.disabled = true;
    for (let i = 0; i < items.length; i += 400) {
      const b = writeBatch(db);
      for (const s of items.slice(i, i + 400)) {
        b.set(doc(db, 'siswa', s.kode), { nama: s.nama, kelas: s.kelas, access_code: s.kode });
      }
      await b.commit();
    }
    toast(items.length + ' siswa diimpor', 'success');
    input.value = '';
  } catch (e) {
    console.error(e);
    toast('Gagal: ' + friendly(e), 'error');
  } finally {
    input.disabled = false;
    if (lbl) lbl.innerHTML = orig;
    render();
  }
};

      });

        izin: iI >= 0 ? (+r[iI] || 0) : 0,

      };
      items.push({
        kode,
        nama: iN >= 0 ? String(r[iN] || '').trim() : '',
        kelas: iC >= 0 ? String(r[iC] || '').trim().toUpperCase() : '',
        a, att
      });
    }
    if (!items.length) { toast('Tidak ada baris valid', 'error'); return; }
    if (!confirm('Import ' + items.length + ' baris untuk periode ' + period + '?')) return;
    if (lbl) lbl.innerHTML = 'Mengimpor…';
    input.disabled = true;
    for (let i = 0; i < items.length; i += 200) {
      const b = writeBatch(db);
      for (const it of items.slice(i, i + 200)) {
        b.set(doc(db, 'nilai', it.kode + '__' + period), {
          siswaId: it.kode, period,
          a0: it.a[0], a1: it.a[1], a2: it.a[2], a3: it.a[3]
        });
        b.set(doc(db, 'absensi', it.kode + '__' + period), {
          siswaId: it.kode, period, ...it.att
        });
      }
      await b.commit();
    }
    toast('Nilai ' + items.length + ' siswa diimpor untuk ' + period, 'success');
    input.value = '';
  } catch (e) {
    console.error(e);
    toast('Gagal: ' + friendly(e), 'error');
  } finally {
    input.disabled = false;
    if (lbl) lbl.innerHTML = orig;
    render();
  }
};

window.exportCSV = async function (kelas, period, btn) {
  await run(btn, 'Menyiapkan…', async () => {
    const [all, p] = await Promise.all([getStudents(), loadPeriod(period)]);
    const list = all.filter(s => s.kelas === kelas).sort((a, b) => a.nama.localeCompare(b.nama));
    const safe = v => { const t = String(v ?? ''); return /^[=+\-@]/.test(t) ? "'" + t : t; };
    const header = ['Kode', 'Nama', 'Kelas', ...ASPECTS, 'Nilai', 'Kategori', 'Hadir', 'Sakit', 'Izin', 'Alfa'];
    const rows = [header];
    for (const s of list) {
      const a = p.nilai[s.id] || EMPTY;
      const n = hitungNilai(a);
      const att = p.absen[s.id] || {};
      rows.push([s.access_code, s.nama, s.kelas, ...a, n ?? '', kategori(n).label,
        att.hadir || 0, att.sakit || 0, att.izin || 0, att.alfa || 0].map(safe));
    }
    const csv = '\ufeff' + rows.map(r =>
      r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')
    ).join('\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `rekap_${kelas}_${period.replace(/\s/g, '_')}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    toast('Rekap diexport', 'success');
  });
};

// ============ EXCEL (ExcelJS) ============
window.dlExcelTemplate = async function (period) {
  const sel = document.getElementById('xlsKelas');
  const kelas = sel && sel.value;
  if (!kelas) { toast('Pilih kelas dulu', 'error'); return; }
  if (!window.ExcelJS) { toast('Library Excel belum termuat, refresh halaman', 'error'); return; }

  const students = await getStudents();
  const list = students.filter(s => s.kelas === kelas).sort((a, b) => a.nama.localeCompare(b.nama));
  if (!list.length) { toast('Tidak ada siswa di kelas ' + kelas, 'error'); return; }

  const existing = await loadPeriod(period);
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Info Walimurid';
  wb.created = new Date();
  const ws = wb.addWorksheet('Nilai ' + period.replace(/\s/g, ''), {
    views: [{ state: 'frozen', ySplit: 1 }]
  });

  ws.columns = [
    { header: 'kode',      key: 'kode',      width: 12 },
    { header: 'nama',      key: 'nama',      width: 38 },
    { header: 'kelas',     key: 'kelas',     width: 8  },
    { header: 'membaca',   key: 'membaca',   width: 11 },
    { header: 'menulis',   key: 'menulis',   width: 11 },
    { header: 'berhitung', key: 'berhitung', width: 11 },
    { header: 'menghafal', key: 'menghafal', width: 11 },
    { header: 'hadir',     key: 'hadir',     width: 8  },
    { header: 'sakit',     key: 'sakit',     width: 8  },
    { header: 'izin',      key: 'izin',      width: 8  },
    { header: 'alfa',      key: 'alfa',      width: 8  }
  ];

  const hRow = ws.getRow(1);
  hRow.height = 22;
  hRow.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 11 };
  hRow.alignment = { vertical: 'middle', horizontal: 'center' };
  hRow.eachCell(c => {
    c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0078D4' } };
    c.border = {
      top:    { style: 'thin', color: { argb: 'FF0078D4' } },
      left:   { style: 'thin', color: { argb: 'FF0078D4' } },
      bottom: { style: 'thin', color: { argb: 'FF0078D4' } },
      right:  { style: 'thin', color: { argb: 'FF0078D4' } }
    };
  });

  const LOCK_FILL = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF2F2F2' } };
  list.forEach(s => {
    const a = existing.nilai[s.id] || ['', '', '', ''];
    const at = existing.absen[s.id] || { hadir: 0, sakit: 0, izin: 0, alfa: 0 };
    const row = ws.addRow({
      kode: s.access_code,
      nama: s.nama,
      kelas: s.kelas,
      membaca: a[0],
      menulis: a[1],
      berhitung: a[2],
      menghafal: a[3],
      hadir: at.hadir || 0,
      sakit: at.sakit || 0,
      izin: at.izin || 0,
      alfa: at.alfa || 0
    });
    ['kode', 'nama', 'kelas'].forEach(k => {
      const cell = row.getCell(k);
      cell.fill = LOCK_FILL;
      cell.font = { color: { argb: 'FF767676' } };
      cell.protection = { locked: true };
    });
    row.eachCell(c => {
      c.border = {
        top:    { style: 'thin', color: { argb: 'FFE1E1E1' } },
        left:   { style: 'thin', color: { argb: 'FFE1E1E1' } },
        bottom: { style: 'thin', color: { argb: 'FFE1E1E1' } },
        right:  { style: 'thin', color: { argb: 'FFE1E1E1' } }
      };
      c.alignment = { vertical: 'middle' };
    });
  });

  const maxRow = list.length + 1;
  for (let r = 2; r <= maxRow; r++) {
    [4, 5, 6, 7].forEach(col => {
      const cell = ws.getCell(r, col);
      cell.dataValidation = {
        type: 'list',
        allowBlank: true,
        formulae: ['"L,CL,KL"'],
        showErrorMessage: true,
        errorStyle: 'stop',
        errorTitle: 'Nilai tidak valid',
        error: 'Pilih salah satu: L, CL, atau KL (atau kosongkan).'
      };
      cell.alignment = { horizontal: 'center', vertical: 'middle' };
    });
    [8, 9, 10, 11].forEach(col => {
      const cell = ws.getCell(r, col);
      cell.dataValidation = {
        type: 'whole',
        operator: 'between',
        allowBlank: true,
        formulae: [0, 30],
        showErrorMessage: true,
        errorStyle: 'stop',
        errorTitle: 'Angka tidak valid',
        error: 'Isi angka antara 0 sampai 30.'
      };
      cell.alignment = { horizontal: 'center', vertical: 'middle' };
    });
  }

  const noteRow = maxRow + 2;
  ws.getCell('A' + noteRow).value = 'PETUNJUK:';
  ws.getCell('A' + noteRow).font = { bold: true, color: { argb: 'FF0078D4' } };
  ws.getCell('A' + (noteRow + 1)).value = 'Kolom membaca/menulis/berhitung/menghafal - pilih L / CL / KL dari dropdown.';
  ws.getCell('A' + (noteRow + 2)).value = 'Kolom hadir/sakit/izin/alfa - isi angka (jumlah hari).';
  ws.getCell('A' + (noteRow + 3)).value = 'JANGAN ubah kolom kode / nama / kelas.';
  ws.getCell('A' + (noteRow + 4)).value = 'Setelah selesai: simpan sebagai .xlsx lalu upload lewat tab Import.';

  ws.autoFilter = { from: 'A1', to: 'K1' };

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `nilai_${kelas}_${period.replace(/\s/g, '')}.xlsx`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Template Excel terunduh', 'success');
};

async function parseXLSX(file) {
  const buf = await file.arrayBuffer();
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(buf);
  const ws = wb.worksheets[0];
  const rows = [];
  ws.eachRow({ includeEmpty: false }, row => {
    const values = row.values;
    rows.push(values.slice(1).map(v => {
      if (v === null || v === undefined) return '';
      if (typeof v === 'object' && v.text) return String(v.text);
      if (typeof v === 'object' && v.result !== undefined) return String(v.result);
      return String(v);
    }));
  });
  return rows;
}

window.importExcel = async function (input, period) {
  const file = input.files && input.files[0];
  if (!file) return;
  const lbl = input.previousElementSibling;
  const orig = lbl ? lbl.innerHTML : '';
  try {
    if (!window.ExcelJS) { toast('Library Excel belum termuat, refresh', 'error'); return; }
    if (lbl) lbl.innerHTML = 'Membaca…';
    input.disabled = true;

    const rows = await parseXLSX(file);
    if (rows.length < 2) { toast('File kosong', 'error'); return; }

    const h = rows[0].map(x => String(x).trim().toLowerCase());
    for (const k of ['kode', 'membaca', 'menulis', 'berhitung', 'menghafal']) {
      if (h.indexOf(k) < 0) { toast('Header "' + k + '" tidak ditemukan', 'error'); return; }
    }
    const iK = h.indexOf('kode');
    const iN = h.indexOf('nama');
    const iC = h.indexOf('kelas');
    const iA = ['membaca', 'menulis', 'berhitung', 'menghafal'].map(k => h.indexOf(k));
    const iH = h.indexOf('hadir'), iS = h.indexOf('sakit'), iI = h.indexOf('izin'), iF = h.indexOf('alfa');

    const items = [];
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      const kode = String(r[iK] || '').trim().toUpperCase();
      if (!kode) continue;
      if (/^petunjuk/i.test(kode) || kode.startsWith('-')) continue;
      if (!/^[A-Z0-9-]+$/.test(kode)) continue;

      const a = iA.map(idx => {
        const v = String(r[idx] || '').trim().toUpperCase();
        return ['L', 'CL', 'KL'].includes(v) ? v : '';
      });
      const att = {
        hadir: iH >= 0 ? Math.max(0, +r[iH] || 0) : 0,
        sakit: iS >= 0 ? Math.max(0, +r[iS] || 0) : 0,
        izin:  iI >= 0 ? Math.max(0, +r[iI] || 0) : 0,
        alfa:  iF >= 0 ? Math.max(0, +r[iF] || 0) : 0
      };
      items.push({
        kode,
        nama: iN >= 0 ? String(r[iN] || '').trim() : '',
        kelas: iC >= 0 ? String(r[iC] || '').trim().toUpperCase() : '',
        a, att
      });
    }

    if (!items.length) { toast('Tidak ada baris valid', 'error'); return; }
    if (!confirm(`Import ${items.length} siswa untuk ${period}?`)) return;

    if (lbl) lbl.innerHTML = `Import ${items.length}…`;
    for (let i = 0; i < items.length; i += 200) {
      const b = writeBatch(db);
      for (const it of items.slice(i, i + 200)) {
        b.set(doc(db, 'nilai', `${it.kode}__${period}`), {
          siswaId: it.kode, period,
          a0: it.a[0], a1: it.a[1], a2: it.a[2], a3: it.a[3]
        });
        b.set(doc(db, 'absensi', `${it.kode}__${period}`), {
          siswaId: it.kode, period, ...it.att
        });
      }
      await b.commit();
    }
    toast(`${items.length} nilai diimpor`, 'success');
    input.value = '';
  } catch (e) {
    console.error(e);
    toast('Gagal: ' + friendly(e), 'error');
  } finally {
    input.disabled = false;
    if (lbl) lbl.innerHTML = orig;
    render();
  }
};

// ============ TEMA ============
window.toggleTheme = function () {
  const h = document.documentElement;
  const next = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  h.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeIcon(next);
  render();
};

function updateThemeIcon(theme) {
  const ico = $('theme-icon');
  if (!ico) return;
  if (theme === 'dark') {
    ico.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
  } else {
    ico.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
}

// ============ BRAND ============
function updateBrand(sc) {
  const logo = $('brand-logo');
  const name = $('brand-name');
  const info = $('brand-info');
  const fname = $('footer-name');
  if (logo && sc.logo) logo.innerHTML = `<span style="font-size:1.125rem">${esc(sc.logo)}</span>`;
  if (name) name.textContent = sc.name;
  if (info) {
    const parts = [];
    if (sc.npsn) parts.push('NPSN ' + sc.npsn);
    if (sc.year) parts.push('T.A. ' + sc.year);
    info.textContent = parts.join(' · ');
  }
  if (fname) fname.textContent = [sc.name, sc.address].filter(Boolean).join(' · ');
  document.title = sc.name + ' · Info Walimurid';
}

// ============ BOOT ============
async function boot() {
  const th = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', th);
  updateThemeIcon(th);

  const hdr = $('app-header'), ftr = $('app-footer'), load = $('loading-overlay');
  if (hdr) hdr.style.display = '';
  if (ftr) ftr.style.display = '';

  try { updateBrand(await getSchool()); }
  catch (e) { console.warn('brand', e); }

  if (load) load.classList.add('hidden');

  window.addEventListener('hashchange', render);
  window.addEventListener('online',  () => toast('Kembali online', 'success'));
  window.addEventListener('offline', () => toast('Offline. Menampilkan data tersimpan.', 'info'));

  // Service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  await render();
}

boot();
