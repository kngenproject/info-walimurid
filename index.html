<style>
:root{--bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--text:#0f172a;--text2:#475569;--muted:#64748b;

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:var(--sh)}

.tbtn{width:38px;height:38px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
.tbtn:hover{background:var(--surface2)}
.container{max-width:1200px;margin:0 auto;padding:1.5rem 1.25rem 4rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;box-shadow:var(--sh);margin-bottom:1.25rem}
h2{font-size:1.35rem;font-weight:700;letter-spacing:-.4px;margin-bottom:.25rem}
h3{font-size:1rem;font-weight:600;margin-bottom:.85rem;display:flex;align-items:center;gap:.5rem}
.sub{color:var(--muted);font-size:.875rem;margin-bottom:1.25rem}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.6rem 1.1rem;border-radius:9px;font-size:.875rem;font-weight:600;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;line-height:1}

input,select,textarea{width:100%;padding:.6rem .8rem;border:1px solid var(--border);border-radius:8px;font-size:.875rem;font-family:inherit;background:var(--surface);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,64,175,.1)}

.alert-err{background:var(--errbg);color:var(--err);border-color:var(--err)}

.badge{display:inline-flex;align-items:center;justify-content:center;padding:.28rem .7rem;border-radius:6px;font-size:.75rem;font-weight:700;min-width:38px}

.li{flex:1;min-width:0}
.lt{font-size:1rem;font-weight:700}

.av2{background:linear-gradient(135deg,#f59e0b,#d97706)}.av3{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.av4{background:linear-gradient(135deg,#ec4899,#db2777)}.av5{background:linear-gradient(135deg,#06b6d4,#0891b2)}
.avT{color:#fff}
.sinfo{flex:1;min-width:0}
.sn{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ssc{font-size:1.35rem;font-weight:800;line-height:1}

th,td{padding:.7rem .85rem;text-align:left;border-bottom:1px solid var(--border)}

.asp::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--border)}
.asp[data-v="L"]::before{background:var(--ok)}.asp[data-v="CL"]::before{background:var(--warn)}.asp[data-v="KL"]::before{background:var(--err)}
.asp .al{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:.6rem}

.sbig{font-size:3.2rem;font-weight:800;line-height:1;letter-spacing:-2px}

.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--border);margin-bottom:1.25rem;overflow-x:auto}
.tab{padding:.7rem 1rem;border:none;background:none;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;white-space:nowrap}
.tab.act{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover{color:var(--text)}
.tc-c{display:none}.tc-c.act{display:block}
.tl{position:relative;padding-left:1.5rem}
.tl::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--border)}
.tli{position:relative;padding-bottom:1rem}
.tli::before{content:'';position:absolute;left:-1.5rem;top:6px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid var(--surface)}
.tli .dt{font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:.2rem;text-transform:uppercase}
.tli .tx{font-size:.875rem}
.stat{display:flex;align-items:center;gap:1rem;padding:1.1rem 1.25rem;background:var(--surface);border:1px solid var(--border);border-radius:10px}
.si{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.siB{background:var(--p50);color:var(--primary)}.siG{background:var(--okbg);color:var(--ok)}
.siA{background:var(--warnbg);color:var(--warn)}.siR{background:var(--errbg);color:var(--err)}
.sv{font-size:1.55rem;font-weight:800;line-height:1;letter-spacing:-.5px}
.sl{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;margin-top:.2rem}
.cs{position:relative;height:200px;max-width:200px;margin:0 auto}
.cw{position:relative;height:240px}
.periods{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.25rem;padding:.35rem;background:var(--surface2);border-radius:10px;width:fit-content}

.per:hover{color:var(--primary)}
.per.act{background:var(--surface);color:var(--primary);box-shadow:var(--sh)}
.rec{padding:1rem 1.15rem;border-radius:10px;background:var(--p50);border-left:3px solid var(--primary);font-size:.875rem;line-height:1.65}
.rec ul{margin:.6rem 0 0 1.2rem}.rec li{margin-bottom:.3rem}
.crumb{font-size:.82rem;color:var(--muted);margin-bottom:.75rem;font-weight:500}
.crumb a{color:var(--primary);cursor:pointer}
.crumb a:hover{text-decoration:underline}
.crumb span{margin:0 .35rem;opacity:.5}
.attgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:.75rem}
.atti{padding:.9rem;border-radius:10px;text-align:center}
.atti.h{background:var(--okbg);color:var(--ok)}.atti.s{background:var(--warnbg);color:var(--warn)}
.atti.i{background:var(--p50);color:var(--primary)}.atti.a{background:var(--errbg);color:var(--err)}
.atti .n{font-size:1.5rem;font-weight:800;line-height:1}
.atti .l{font-size:.72rem;font-weight:600;margin-top:.15rem;opacity:.85}
.footer{text-align:center;padding:2rem 1.25rem;color:var(--muted);font-size:.8rem;border-top:1px solid var(--border);background:var(--surface)}
.empty{padding:2rem;text-align:center;color:var(--muted);font-size:.875rem}
.empty .ico{font-size:2rem;margin-bottom:.5rem;opacity:.5}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--muted);z-index:9999}
#loading.hide{display:none}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin-right:.75rem}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:640px){.container{padding:1rem .85rem 3rem}.card{padding:1.15rem}.sbig{font-size:2.6rem}.attgrid{grid-template-columns:repeat(2,1fr)}.brand h1{font-size:.85rem}}
@media print{.header,.footer,.btn,.tbtn,.tabs,.periods,.crumb,.np{display:none!important}.card{box-shadow:none;border:1px solid #ddd}.tc-c{display:block!important}body{background:#fff}}
</style>

      <div class="blogo" id="blogo">🏫</div>
      <div><h1 id="bname">Memuat…</h1><p id="binfo"></p></div>

    <nav class="nav">
      <a onclick="go('/')" id="nav-home">Beranda</a>

      <button class="tbtn" onclick="toggleTheme()" id="tbtn">🌙</button>

  </div>
</header>

<main class="container" id="app"></main>

<footer class="footer" id="ftr" style="display:none">
  <div id="fname"></div>
  <div style="margin-top:.4rem">Sistem Informasi Perkembangan Siswa</div>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, where, serverTimestamp, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// ==================================================================
// 🔥 GANTI DENGAN FIREBASE CONFIG MILIKMU
// ==================================================================
const firebaseConfig = window.FIREBASE_CONFIG;
if (!firebaseConfig || !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith('ISI')) {
  document.getElementById('loading').innerHTML = '⚠️ Konfigurasi Firebase belum diisi (config.js)';
  throw new Error('Firebase config belum valid');
}
// ==================================================================

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);
let currentUser = null, authReady = false;
onAuthStateChanged(auth, u => {
  currentUser = u; authReady = true;
  if (parseRoute()[0] === 'admin') render();
});

// ============ KONFIGURASI ============
const DEFAULT_SCHOOL = {
  name: 'SD Negeri Contoh',
  address: 'Jl. Pendidikan No. 1, Kota Contoh',
  npsn: '12345678',
  logo: '🏫',
  year: '2025/2026',
  headmaster: 'Drs. H. Ahmad Subarjo, M.Pd.'
};
const ASPECTS = ['Membaca', 'Menulis', 'Berhitung', 'Menghafal'];
const ASPECT_SCORES = { L: 90, CL: 80, KL: 70 };
const ASPECT_LABELS = { L: 'Lancar', CL: 'Cukup Lancar', KL: 'Kurang Lancar', '': 'Belum dinilai' };
const PERIODS = ['STS 1', 'STS 2', 'SAS'];
const DEFAULT_CLASSES = { '4B': 'Siti Aminah, S.Pd.', '4C': 'Ahmad Fauzi, S.Pd.', '4D': 'Nur Hasanah, S.Pd.' };

const SEED = {
  '4B': [['ADZKIYA RARAS MAHFUDZA','CL','KL','L','L'],['ALMAIRA ZEA ACHMAD','CL','CL','L','L'],['ANANDA SYIFA FATHIMATUZZAHRA','KL','CL','KL','KL'],['APRILIA RAFANIA','KL','KL','KL','CL'],['ARUM BAHARI LUTHFIKA ALI','L','L','CL','CL'],['ARUM ZAHWA ALIFA','L','L','L','L'],['AYRA ASKADINA SALSABILA','CL','CL','KL','KL'],['ELVINA AMIRA SALSABILA','KL','L','KL','KL'],['EMBUN SEKAR ARUMINGRATRI','KL','KL','KL','KL'],['FITRIYA FATHIYYATURAHMA','CL','KL','KL','KL'],['JANE CALISTA PUTRI','CL','KL','KL','KL'],['KAILA ZAFIRA','CL','KL','L','CL'],['MAFAZA ILYANA PRAYUDI','CL','L','L','L'],['MARSA AZKA FITRIA','KL','CL','CL','L'],['NAJMA ASHFA GAYATRI','CL','L','L','L'],['NESSA ARYANA TSURAYYA','L','KL','L','L'],['YOLANDA SISILIA','L','L','L','L'],['ZIVANA ADZKIYA AULIA','KL','KL','KL','KL']],
  '4C': [['ABDUL JALAL SAPUTRA','KL','KL','KL','KL'],['ABIDZAR DWIQI AL FATIH','KL','KL','KL','KL'],['ADE ARVIE ASSLAM','','','',''],['AHMAD ATHALLA OKTAVIAN','CL','L','CL','L'],['AHMAD BRILIANSYAH','L','KL','KL','KL'],['AHMAD FAIZ HUSAIN NAJIB','KL','KL','KL','KL'],['AHMAD TAJ ATHIF','CL','CL','L','L'],['ALFA FALAQUN NAJAH','L','L','L','L'],['ANDRYAN PRADIPTA','L','KL','KL','KL'],['ARKA WIJAYANTO','KL','L','CL','L'],['ATHA RAQILLA KHALIF','KL','KL','L','L'],['HAIDAR FARUQ','CL','KL','L','L'],['MUHAMMAD ABBAD NAILUN NABHAN','KL','KL','KL','KL'],['MUHAMMAD ASYRAF ABRORI','L','L','CL','CL'],['MUHAMMAD DAVID NAJMI','KL','KL','KL','KL'],['MUHAMMAD FALAH AKBAR','L','KL','KL','KL'],['MUHAMMAD HAWWIN ALAINA','KL','CL','L','L'],['MUHAMMAD KENZIE ARZIQI PUTRA','L','L','CL','L'],['MUHAMMAD RAKHUL ABYAN AQIL','KL','L','L','L'],['MUHAMMAD SHOLAHUDDIN AL HADI','CL','L','L','L'],['RAJA AHZA AHURAYAZDA','KL','KL','KL','CL'],['SATRIA WICAKSONO PUTRA RIFAN','L','KL','KL','KL'],['YUSHFIKA ARFAN MAULANA','CL','KL','CL','L'],['YUSUF FATIH ARZAQI','KL','KL','KL','CL'],['ZAIDAN ARIYANTO','KL','KL','KL','L']],
  '4D': [['ABYAN SHIHAB PRANAJA','','','',''],['AHMAD FAIZUL MUIZ','L','L','L','L'],['AHMAD FARIS HABIBI','KL','KL','KL','KL'],['AHMAD HISYAM MAULANA','CL','KL','KL','KL'],['AHMAD MUGHNI LABIB','L','L','L','L'],['AHMAD ULIN NUHA','L','L','L','L'],['ARCHANDRA SEAN ALFARIZ','KL','KL','KL','KL'],['ARSYA AHMAD JAKA ARDHANI','KL','KL','KL','KL'],['AULIAN GHAIDA FATTANA','KL','KL','KL','KL'],['AZKA EVAN MAULANA','L','L','L','L'],['AZKAL HIMAM SYAUQI','L','KL','L','CL'],['ISMAIL NIZAM ARKANUDDIN EL KAFEEL','CL','L','CL','L'],['MALVIN MESHACH AGAM AGLER','KL','KL','KL','KL'],['MUHAMMAD ABID RAJENDRA','KL','KL','KL','KL'],['MUHAMMAD ADRIAN PRADIPTA','KL','CL','KL','L'],['MUHAMMAD AL GENTZA','KL','KL','CL','CL'],['MUHAMMAD BAYU SATRIO','KL','KL','KL','KL'],['MUHAMMAD BIMA MUJTABA','L','KL','KL','CL'],['MUHAMMAD LUTHFI','CL','L','CL','L'],['MUHAMMAD MAULANA ISHAQ','CL','CL','KL','L'],['MUHAMMAD SALUM ASWHIN DARMAWAN','L','L','L','L'],['MUHAMMAD ULIL ALBAB','L','CL','CL','L'],['RAFAN SAUQI FIL ARDHA','KL','CL','CL','L'],['SHAQUILLE GIBRAN ALAIKASSALAM','L','L','CL','L'],['SUKMA ARFAN FAELANI','L','KL','KL','KL']]
};

// ============ STATE ============
let school = { ...DEFAULT_SCHOOL };
let classesCache = {};  // {kelas: {wali}}
let studentsCache = []; // [{id, nama, kelas, access_code}]
let state = { route: '/', data: {} };
let charts = [];

// ============ FIREBASE HELPERS ============
async function getSchool() {
  try {
    const snap = await getDoc(doc(db, 'settings', 'main'));
    if (snap.exists()) return { ...DEFAULT_SCHOOL, ...snap.data() };
  } catch (e) { console.warn('getSchool', e); }
  return { ...DEFAULT_SCHOOL };
}

async function saveSchool(data) {
  await setDoc(doc(db, 'settings', 'main'), data, { merge: true });
}

async function getClasses() {
  const snap = await getDocs(collection(db, 'kelas'));
  const out = {};
  snap.forEach(d => { out[d.id] = d.data().wali || ''; });
  return out;
}

async function getStudents() {
  const snap = await getDocs(collection(db, 'siswa'));
  const out = [];
  snap.forEach(d => out.push({ id: d.id, ...d.data() }));
  return out;
}

async function getNilai(sid, period) {
  const snap = await getDoc(doc(db, 'nilai', `${sid}__${period}`));
  if (!snap.exists()) return ['', '', '', ''];
  const d = snap.data();
  return [d.a0 || '', d.a1 || '', d.a2 || '', d.a3 || ''];
}

async function saveNilai(sid, period, arr) {
  await setDoc(doc(db, 'nilai', `${sid}__${period}`), {
    siswaId: sid, period, a0: arr[0], a1: arr[1], a2: arr[2], a3: arr[3]
  });
}

async function getAbsen(sid, period) {
  const snap = await getDoc(doc(db, 'absensi', `${sid}__${period}`));
  if (!snap.exists()) return { hadir: 0, sakit: 0, izin: 0, alfa: 0 };
  return snap.data();
}

async function saveAbsen(sid, period, data) {
  await setDoc(doc(db, 'absensi', `${sid}__${period}`), { siswaId: sid, period, ...data });
}

async function getCatatan(sid, period) {
  const snap = await getDocs(collection(db, 'catatan'));
  const out = [];
  snap.forEach(d => {
    const v = d.data();
    if (v.siswaId === sid && (!period || v.period === period)) {
      out.push({ id: d.id, ...v });
    }
  });
  out.sort((a, b) => (b.ts?.seconds || 0) - (a.ts?.seconds || 0));
  return out;
}

async function addCatatan(sid, period, text) {
  await addDoc(collection(db, 'catatan'), {
    siswaId: sid, period, text, ts: serverTimestamp()
  });
}

// ============ SEED ============
async function seedIfEmpty() {
  const students = await getStudents();
  if (students.length > 0) return false;
  const b = writeBatch(db);
  for (const [kelas, wali] of Object.entries(DEFAULT_CLASSES)) {
    b.set(doc(db, 'kelas', kelas), { wali });
  }
  b.set(doc(db, 'settings', 'main'), DEFAULT_SCHOOL);
  await b.commit();

  for (const [kelas, arr] of Object.entries(SEED)) {
    for (let i = 0; i < arr.length; i++) {
      const s = arr[i];
      const sid = `${kelas}-${String(i + 1).padStart(3, '0')}`;
      await setDoc(doc(db, 'siswa', sid), {
        nama: s[0], kelas, access_code: sid
      });
      await saveNilai(sid, PERIODS[0], [s[1], s[2], s[3], s[4]]);
      await saveAbsen(sid, PERIODS[0], { hadir: 20, sakit: 0, izin: 0, alfa: 0 });
    }
  }
  return true;
}

// ============ UTIL ============
function hitungNilai(a) {
  const v = a.filter(x => x);
  if (!v.length) return null;
  return Math.round(v.reduce((s, x) => s + (ASPECT_SCORES[x] || 0), 0) / v.length);
}

function kategori(n) {
  if (n === null) return ['Belum Dinilai', 'Em'];
  if (n >= 85) return ['Baik', 'Ok'];
  if (n >= 75) return ['Cukup', 'Cu'];
  return ['Perlu Pendampingan', 'Pe'];
}

function badge(v) {
  const cls = v === 'L' ? 'bL' : v === 'CL' ? 'bCL' : v === 'KL' ? 'bKL' : 'bE';
  return `<span class="badge ${cls}">${v || '—'}</span>`;
}

function rekomendasi(a) {
  if (!a.some(x => x)) return ['Guru belum menginput nilai. Silakan hubungi wali kelas.', []];
  const items = [];
  a.forEach((v, i) => {
    if (v === 'KL') items.push(`Perlu pendampingan intensif pada <b>${ASPECTS[i]}</b>.`);
    else if (v === 'CL') items.push(`Perlu penguatan rutin pada <b>${ASPECTS[i]}</b>.`);
  });
  if (!items.length) return ['Ananda menunjukkan penguasaan baik di semua aspek. Berikan pengayaan dan apresiasi.', []];
  return ['Beberapa aspek masih perlu perhatian khusus:', items];
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function toast(msg, type = 'ok') {
  const d = document.createElement('div');
  d.className = `alert alert-${type}`;
  d.textContent = msg;
  d.style.cssText = 'position:fixed;top:1rem;right:1rem;z-index:99999;max-width:320px;box-shadow:0 10px 15px rgba(0,0,0,.1)';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3000);
}

// ============ ROUTER ============
function go(path) {
  window.location.hash = '#' + path;
}

function parseRoute() {
  const hash = (window.location.hash || '#/').slice(1);
  return hash.split('/').filter(Boolean).map(decodeURIComponent);
}

async function render() {
  updateNav();
  const parts = parseRoute();
  try {
    if (parts.length === 0) { homeStudents = []; await renderHome(); return homeSearch(''); }
    if (parts[0] === 'admin') return await renderAdmin(parts.slice(1));
    if (parts[0] === 'kelas' && parts[1]) return await renderKelas(parts[1]);
    if (parts[0] === 'siswa' && parts[1]) return await renderSiswa(parts[1], parts[2] || PERIODS[0]);
    return await renderHome();
  } catch (e) {
    console.error(e);
    document.getElementById('app').innerHTML = `<div class="alert alert-err">Error: ${esc(e.message)}</div>`;
  }
}

function updateNav() {
  const parts = parseRoute();
  const cur = parts[0] || 'home';
  document.getElementById('nav-home').classList.toggle('act', cur === 'home' || cur === '');
  document.getElementById('nav-admin').classList.toggle('act', cur === 'admin');
}

      <div class="tw"><table id="tblK">
        <thead><tr><th>Kode</th><th>Nama</th>${ASPECTS.map(a => `<th class="tc">${a}</th>`).join('')}<th class="tc">Nilai</th><th class="tc">Aksi</th></tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table></div>
    `;
  } else if (tab === 'edit') {
    const sid = sub[1];
    const periode = sub[2] || PERIODS[0];
    const snap = await getDoc(doc(db, 'siswa', sid));
    if (!snap.exists()) { content = `<div class="alert alert-err">Siswa tidak ditemukan.</div>`; }
    else {
      const s = { id: snap.id, ...snap.data() };
      const a = await getNilai(sid, periode);
      const att = await getAbsen(sid, periode);
      const notes = await getCatatan(sid, periode);
      const nVal = hitungNilai(a);
      const [kat, kc] = kategori(nVal);

      const notesHtml = notes.length ? notes.map(n => `
        <div class="tli"><div class="dt">${n.ts ? new Date(n.ts.seconds * 1000).toLocaleString('id-ID') : '-'}</div>
        <div class="tx">${esc(n.text)}</div></div>`).join('') : '<div class="empty">Belum ada catatan.</div>';

      content = `
        <button class="btn bo b-sm" style="margin-bottom:1rem" onclick="go('/admin/kelas/${s.kelas}/${encodeURIComponent(periode)}')">← Kembali</button>
        <div class="grid g2">
          <div class="card">
            <h3>✏️ Form Penilaian · ${periode}</h3>
            <form oninput="livePreview(this)" onsubmit="saveEdit(event,'${sid}','${periode}')">
              <div class="grid g4">
                ${ASPECTS.map((_, i) => `
                  <div class="fg"><label>${ASPECTS[i]}</label>
                    <select name="a${i}">
                      ${['', 'L', 'CL', 'KL'].map(v => `<option value="${v}" ${a[i] === v ? 'selected' : ''}>${v || '— kosong —'}</option>`).join('')}
                    </select>
                  </div>`).join('')}
              </div>
              <h3 style="margin-top:1rem">📅 Absensi</h3>
              <div class="grid g4">
                <div class="fg"><label>Hadir</label><input name="hadir" type="number" min="0" value="${att.hadir || 0}"></div>
                <div class="fg"><label>Sakit</label><input name="sakit" type="number" min="0" value="${att.sakit || 0}"></div>
                <div class="fg"><label>Izin</label><input name="izin" type="number" min="0" value="${att.izin || 0}"></div>
                <div class="fg"><label>Alfa</label><input name="alfa" type="number" min="0" value="${att.alfa || 0}"></div>
              </div>
              <div class="fg"><label>➕ Catatan Guru (opsional)</label>
                <textarea name="note" rows="3" placeholder="Catatan tambahan..."></textarea></div>
              <div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn bp">💾 Simpan</button><button class="btn bs" name="next">💾 Simpan &amp; Berikutnya →</button></div>
            </form>
          </div>
          <div class="card">
            <h3>Pratinjau</h3>
            <div style="text-align:center;padding:1rem 0">
              <div id="pvN" class="sbig s${kc}" style="font-size:3rem">${nVal !== null ? nVal : '—'}</div>
              <div id="pvK" style="font-size:.95rem;font-weight:600;margin-top:.35rem">${kat}</div>
            </div>
            <div style="border-top:1px solid var(--border);padding-top:1rem;margin-top:1rem">
              <h3 style="font-size:.9rem">Riwayat Catatan</h3>
              <div class="tl">${notesHtml}</div>
            </div>
          </div>
        </div>
      `;
    }
  } else if (tab === 'siswa') {
    const rows = students.sort((a, b) => (a.kelas + a.nama).localeCompare(b.kelas + b.nama)).map(s => `
      <tr>
        <td><code style="font-size:.75rem">${esc(s.access_code)}</code></td>
        <td>${esc(s.nama)}</td>
        <td>${esc(s.kelas)}</td>
        <td class="tc" style="white-space:nowrap">
          <button class="btn bo b-sm" onclick="go('/admin/edit-siswa/${s.id}')">Edit</button>
          <button class="btn bo b-sm" style="color:var(--err);border-color:var(--err)" data-nama="${esc(s.nama)}" onclick="hapusSiswa('${s.id}', this.dataset.nama)">Hapus</button>
        </td>
      </tr>`).join('');
    content = `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem">
        <div class="search" style="flex:1;min-width:200px;margin-bottom:0">
          <input placeholder="Cari nama..." oninput="filterRows(this.value,'#tblAll tbody tr')">
        </div>
        <button class="btn bp b-sm" onclick="go('/admin/add-siswa')">+ Tambah Siswa</button>
      </div>
      <div class="tw"><table id="tblAll">
        <thead><tr><th>Kode</th><th>Nama</th><th>Kelas</th><th class="tc">Aksi</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    `;
  } else if (tab === 'add-siswa') {
    content = `
      <button class="btn bo b-sm" style="margin-bottom:1rem" onclick="go('/admin/siswa')">← Kembali</button>
      <div class="card" style="max-width:640px">
        <h3>Tambah Siswa</h3>
        <form onsubmit="addSiswa(event)">
          <div class="fg"><label>Nama Lengkap</label><input name="nama" required></div>
          <div class="grid g2">
            <div class="fg"><label>Kelas</label><input name="kelas" required placeholder="4B" style="text-transform:uppercase"></div>
            <div class="fg"><label>Kode Akses</label><input name="kode" required placeholder="4B-019" style="text-transform:uppercase"></div>
          </div>
          <button class="btn bp">💾 Simpan</button>
        </form>
      </div>
    `;
  } else if (tab === 'edit-siswa') {
    const sid = sub[1];
    const snap = await getDoc(doc(db, 'siswa', sid));
    if (!snap.exists()) { content = `<div class="alert alert-err">Siswa tidak ditemukan.</div>`; }
    else {
      const s = { id: snap.id, ...snap.data() };
      content = `
        <button class="btn bo b-sm" style="margin-bottom:1rem" onclick="go('/admin/siswa')">← Kembali</button>
        <div class="card" style="max-width:640px">
          <h3>Edit Siswa</h3>
          <form onsubmit="editSiswa(event,'${sid}')">
            <div class="fg"><label>Nama Lengkap</label><input name="nama" required value="${esc(s.nama)}"></div>
            <div class="grid g2">
              <div class="fg"><label>Kelas</label><input name="kelas" required value="${esc(s.kelas)}"></div>
              <div class="fg"><label>Kode Akses</label><input name="kode" required value="${esc(s.access_code)}"></div>
            </div>
            <button class="btn bp">💾 Simpan</button>
          </form>
        </div>
      `;
    }
  } else if (tab === 'setting') {
    const sc = await getSchool();
    const waliRows = kelasSet.map(k => `
      <div class="fg"><label>Wali Kelas ${k}</label><input name="wali_${k}" value="${esc(classes[k] || '')}"></div>
    `).join('');
    content = `
      <form onsubmit="saveSetting(event)">
        <div class="card">
          <h3>🏫 Informasi Sekolah</h3>
          <div class="grid g2">
            <div class="fg"><label>Nama Sekolah</label><input name="school_name" value="${esc(sc.name)}"></div>
            <div class="fg"><label>NPSN</label><input name="school_npsn" value="${esc(sc.npsn)}"></div>
            <div class="fg"><label>Alamat</label><input name="school_address" value="${esc(sc.address)}"></div>
            <div class="fg"><label>Logo (emoji)</label><input name="school_logo" value="${esc(sc.logo)}"></div>
            <div class="fg"><label>Tahun Ajaran</label><input name="school_year" value="${esc(sc.year)}"></div>
            <div class="fg"><label>Kepala Sekolah</label><input name="school_headmaster" value="${esc(sc.headmaster)}"></div>
          </div>
        </div>
        <div class="card">
          <h3>👥 Wali Kelas</h3>
          <div class="grid g2">${waliRows || '<div class="empty">Belum ada kelas.</div>'}</div>
        </div>
        <button class="btn bp">💾 Simpan Pengaturan</button>
      </form>
    `;
  } else if (tab === 'seed') {
    content = `
      <div class="card">
        <h3>🌱 Seed Data Awal</h3>
        <p style="color:var(--muted);margin-bottom:1rem;font-size:.9rem">
          Fitur ini akan mengisi database dengan data kelas 4B, 4C, 4D beserta nilai STS 1.
          <br><b>Hanya jalankan sekali</b> saat database kosong. Kalau data sudah ada, akan dilewati.
        </p>
        <div class="alert alert-info">⚠️ Akan menambahkan ~68 siswa + nilai + absensi ke Firestore.</div>
        <button class="btn bp" onclick="doSeed()">🌱 Jalankan Seed</button>
      </div>
      <div class="card">
        <h3>🗑️ Reset Semua Data</h3>
        <p style="color:var(--muted);margin-bottom:1rem;font-size:.9rem">Hapus semua siswa, nilai, absensi, catatan. Pengaturan tetap.</p>
        <button class="btn bd" onclick="resetData()">Hapus Semua Data Siswa</button>
      </div>
    `;
  }

  app.innerHTML = `
    <div class="shead">
      <div>
        <h2>Panel Guru</h2>
        <p class="sub" style="margin-bottom:0">Kelola nilai, siswa, dan pengaturan</p>
      </div>
    </div>
    <div style="text-align:right;margin-bottom:.75rem"><button class="btn bo b-sm" onclick="doLogout()">Keluar</button></div>
    <div class="card">${tabs}${content}</div>
  `;
}

function renderLogin(err = '') {
  document.getElementById('app').innerHTML = `
    <div class="shead"><div>
      <h2>Panel Guru</h2>
      <p class="sub" style="margin-bottom:0">Masuk untuk mengelola data</p>
    </div></div>
    <div class="card" style="max-width:420px">
      ${err ? `<div class="alert alert-err">${esc(err)}</div>` : ''}
      <form onsubmit="doLogin(event)">
        <div class="fg"><label>Email</label><input name="email" type="email" required autocomplete="username"></div>
        <div class="fg"><label>Password</label><input name="pass" type="password" required autocomplete="current-password"></div>
        <button class="btn bp">Masuk</button>
      </form>
    </div>`;
}

window.doLogin = async function (ev) {
  ev.preventDefault();
  const f = ev.target;
  try {
    await signInWithEmailAndPassword(auth, f.email.value.trim(), f.pass.value);
  } catch (e) {
    renderLogin('Email atau password salah.');
  }
};

window.doLogout = async function () {
  await signOut(auth);
  go('/');
};

// ============ FAVORIT & PENCARIAN BERANDA ============
let homeStudents = [];
function getFavs() { try { return JSON.parse(localStorage.getItem('favSiswa') || '[]'); } catch (e) { return []; } }
function isFav(id) { return getFavs().some(f => f.id === id); }
function rowSiswa(s, i = 0) {
  const ini = s.nama.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
  return `<div class="srow" onclick="go('/siswa/${s.id}')">
    <div class="av av${i % 6}">${ini}</div>
    <div class="sinfo"><div class="sn">${esc(s.nama)}</div><div class="sm">Kelas ${esc(s.kelas)}</div></div>
    <div class="la">→</div></div>`;
}
window.toggleFav = function (sid, el) {
  let favs = getFavs();
  if (isFav(sid)) favs = favs.filter(f => f.id !== sid);
  else favs.push({ id: sid, nama: el.dataset.nama, kelas: el.dataset.kelas });
  localStorage.setItem('favSiswa', JSON.stringify(favs));
  el.textContent = isFav(sid) ? '★ Favorit' : '☆ Favorit';
  toast(isFav(sid) ? '★ Ditambahkan ke favorit' : 'Dihapus dari favorit', 'ok');
};
window.homeSearch = async function (q) {
  q = (q || '').trim().toLowerCase();
  const box = document.getElementById('hres');
  const card = document.getElementById('hkelas');
  if (!box) return;
  if (card) card.style.display = q ? 'none' : '';
  if (!q) {
    const favs = getFavs();
    box.innerHTML = favs.length ? '<h3 style="margin-bottom:.6rem">★ Favorit Saya</h3>' + favs.map(f => rowSiswa(f)).join('') : '';
    return;
  }
  if (!homeStudents.length) homeStudents = await getStudents();
  const hits = homeStudents.filter(s => s.nama.toLowerCase().includes(q))
    .sort((a, b) => a.nama.localeCompare(b.nama)).slice(0, 30);
  box.innerHTML = hits.length ? hits.map((s, i) => rowSiswa(s, i)).join('')
    : '<div class="empty"><div class="ico">🔎</div>Nama tidak ditemukan.</div>';
};
window.livePreview = function (f) {
  const n = hitungNilai([f.a0.value, f.a1.value, f.a2.value, f.a3.value]);
  const [kt, kc] = kategori(n);
  const pn = document.getElementById('pvN');
  pn.textContent = n !== null ? n : '—';
  pn.className = 'sbig s' + kc;
  document.getElementById('pvK').textContent = kt;
};

// ============ ACTIONS ============
window.go = go;

window.toggleTheme = function () {
  const h = document.documentElement;
  const next = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  h.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.getElementById('tbtn').textContent = next === 'dark' ? '☀' : '🌙';
  destroyCharts();
  render();
};

window.showTab = function (id, btn) {
  document.querySelectorAll('.tc-c').forEach(x => x.classList.remove('act'));
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('act'));
  document.getElementById(id).classList.add('act');
  btn.classList.add('act');
};

window.filterRows = function (q, sel) {
  const s = q.toLowerCase();
  document.querySelectorAll(sel).forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(s) ? '' : 'none';
  });
};

window.saveEdit = async function (ev, sid, period) {
  ev.preventDefault();
  const f = ev.target;
  const btn = ev.submitter;
  const goNext = !!btn && btn.name === 'next';
  const buttons = [...f.querySelectorAll('button')];
  const labels = buttons.map(b => b.textContent);
  buttons.forEach(b => { b.disabled = true; });
  if (btn) btn.textContent = '⏳ Menyimpan…';
  try {
    await saveNilai(sid, period, [f.a0.value, f.a1.value, f.a2.value, f.a3.value]);
    await saveAbsen(sid, period, {
      hadir: +f.hadir.value || 0, sakit: +f.sakit.value || 0,
      izin: +f.izin.value || 0, alfa: +f.alfa.value || 0
    });
    if (f.note.value.trim()) await addCatatan(sid, period, f.note.value.trim());
    toast('✅ Tersimpan', 'ok');
    if (goNext) {
      const all = await getStudents();
      const cur = all.find(s => s.id === sid);
      const list = all.filter(s => cur && s.kelas === cur.kelas).sort((a, b) => a.nama.localeCompare(b.nama));
      const nx = list[list.findIndex(s => s.id === sid) + 1];
      if (nx) return go(`/admin/edit/${nx.id}/${encodeURIComponent(period)}`);
      toast('Ini siswa terakhir di kelas ini', 'info');
    }
    setTimeout(render, 500);
  } catch (e) {
    toast('Gagal menyimpan: ' + e.message, 'err');
    buttons.forEach((b, i) => { b.disabled = false; b.textContent = labels[i]; });
  }
};

window.addSiswa = async function (ev) {
  ev.preventDefault();
  const f = ev.target;
  const nama = f.nama.value.trim();
  const kelas = f.kelas.value.trim().toUpperCase();
  const kode = f.kode.value.trim().toUpperCase();
  if (!nama || !kelas || !kode) return;
  const ref = doc(db, 'siswa', kode);
  const exists = await getDoc(ref);
  if (exists.exists()) { toast('Kode sudah dipakai', 'err'); return; }
  await setDoc(ref, { nama, kelas, access_code: kode });
  toast('✅ Siswa ditambahkan', 'ok');
  go('/admin/siswa');
};

window.editSiswa = async function (ev, sid) {
  ev.preventDefault();
  const f = ev.target;
  await updateDoc(doc(db, 'siswa', sid), {
    nama: f.nama.value.trim(),
    kelas: f.kelas.value.trim().toUpperCase(),
    access_code: f.kode.value.trim().toUpperCase()
  });
  toast('✅ Diperbarui', 'ok');
  go('/admin/siswa');
};

window.hapusSiswa = async function (sid, nama) {
  if (!confirm(`Hapus siswa "${nama}"?`)) return;
  await deleteDoc(doc(db, 'siswa', sid));
  for (const p of PERIODS) {
    await deleteDoc(doc(db, 'nilai', `${sid}__${p}`));
    await deleteDoc(doc(db, 'absensi', `${sid}__${p}`));
  }
  const notes = await getCatatan(sid, null);
  for (const n of notes) await deleteDoc(doc(db, 'catatan', n.id));
  toast('🗑️ Dihapus', 'ok');
  render();
};

window.saveSetting = async function (ev) {
  ev.preventDefault();
  const f = ev.target;
  const data = {
    name: f.school_name.value.trim(),
    npsn: f.school_npsn.value.trim(),
    address: f.school_address.value.trim(),
    logo: f.school_logo.value.trim(),
    year: f.school_year.value.trim(),
    headmaster: f.school_headmaster.value.trim()
  };
  await saveSchool(data);
  const wali = {};
  for (const k of Object.keys(DEFAULT_CLASSES)) {
    const inp = f['wali_' + k];
    if (inp) wali[k] = inp.value.trim();
  }
  const students = await getStudents();
  const kelasSet = [...new Set(students.map(s => s.kelas))];
  for (const k of kelasSet) {
    const inp = f['wali_' + k];
    if (inp) await setDoc(doc(db, 'kelas', k), { wali: inp.value.trim() }, { merge: true });
  }
  toast('✅ Pengaturan disimpan', 'ok');
  school = await getSchool();
  updateBrand();
};

window.doSeed = async function () {
  if (!confirm('Jalankan seed? Proses ini menambah data siswa ke Firestore.')) return;
  try {
    const done = await seedIfEmpty();
    toast(done ? '✅ Seed selesai' : '⚠️ Data sudah ada', done ? 'ok' : 'info');
    setTimeout(render, 800);
  } catch (e) { toast('Error: ' + e.message, 'err'); }
};

window.resetData = async function () {
  if (!confirm('HAPUS SEMUA DATA SISWA? Tidak bisa dibatalkan.')) return;
  if (!confirm('Yakin? Ketik OK untuk konfirmasi terakhir.')) return;
  const students = await getStudents();
  for (const s of students) {
    await deleteDoc(doc(db, 'siswa', s.id));
    for (const p of PERIODS) {
      await deleteDoc(doc(db, 'nilai', `${s.id}__${p}`));
      await deleteDoc(doc(db, 'absensi', `${s.id}__${p}`));
    }
    const notes = await getCatatan(s.id, null);
    for (const n of notes) await deleteDoc(doc(db, 'catatan', n.id));
  }
  toast('🗑️ Semua data dihapus', 'ok');
  render();
};

window.exportCSV = async function (kelas, period) {
  const all = await getStudents();
  const list = all.filter(s => s.kelas === kelas).sort((a, b) => a.nama.localeCompare(b.nama));
  const header = ['Kode', 'Nama', 'Kelas', ...ASPECTS, 'Nilai', 'Kategori', 'Hadir', 'Sakit', 'Izin', 'Alfa'];
  const rows = [header];
  for (const s of list) {
    const a = await getNilai(s.id, period);
    const n = hitungNilai(a);
    const [kt] = kategori(n);
    const att = await getAbsen(s.id, period);
    rows.push([s.access_code, s.nama, s.kelas, ...a, n ?? '', kt, att.hadir || 0, att.sakit || 0, att.izin || 0, att.alfa || 0]);
  }
  const csv = '\ufeff' + rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `rekap_${kelas}_${period.replace(/\s/g, '_')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
};

// ============ BOOT ============
function updateBrand() {
  document.getElementById('blogo').textContent = school.logo || '🏫';
  document.getElementById('bname').textContent = school.name;
  document.getElementById('binfo').textContent = `NPSN ${school.npsn} · T.A. ${school.year}`;
  document.getElementById('fname').textContent = `${school.name} · ${school.address}`;
  document.title = `${school.name} · Info Walimurid`;
}

async function boot() {
  // theme
  const th = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', th);
  document.getElementById('tbtn').textContent = th === 'dark' ? '☀' : '🌙';

  try {
    school = await getSchool();
    updateBrand();
  } catch (e) {
    console.warn('brand fail', e);
  }

  document.getElementById('loading').classList.add('hide');
  document.getElementById('hdr').style.display = '';
  document.getElementById('ftr').style.display = '';

  window.addEventListener('hashchange', render);
  await render();
}

boot();
</script>
